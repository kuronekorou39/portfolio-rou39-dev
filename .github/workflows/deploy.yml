name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # これにより push で uraneko フロントも自動デプロイされる
      # (UranekoFrontendStack は dist があればデプロイ、無ければ既存温存)
      - name: Build frontend-uraneko
        run: npm run build:uraneko

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy CDK
        run: cd infra && npx cdk deploy --all --require-approval never
        env:
          # Google OAuth のクライアントID はソース直書き、シークレットは Secrets Manager
          # (portfolio/google-oauth-client-secret)管理のため CI には渡さない
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

      - name: Seed projects data
        run: node scripts/seed/seed-projects.mjs

# ============================================================
# GitHub Secrets の設定手順
# ============================================================
#
# 1. GitHubリポジトリのページを開く
# 2. Settings → Secrets and variables → Actions に移動
# 3. "New repository secret" をクリックして、以下の3つを登録する
#
# ■ AWS_ACCESS_KEY_ID
#   - IAMユーザー portfolio-deployer のアクセスキーID
#   - 例: AKIA...
#
# ■ AWS_SECRET_ACCESS_KEY
#   - IAMユーザー portfolio-deployer のシークレットアクセスキー
#   - 例: wJalrX...
#
# ■ ALERT_EMAIL
#   - AWS予算アラートの通知先メールアドレス
#   - 例: your-email@example.com
#
# ※ Google OAuth / GitHub PAT は GitHub Secrets ではなく AWS Secrets Manager で管理する
#   (portfolio/google-oauth-client-secret, portfolio/github-token)。
#   クライアントID等の公開値は infra のソースに直書き。
#
# ============================================================
