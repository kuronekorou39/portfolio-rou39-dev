<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">マップから軌跡の再生へ</text>

  <!-- マップ -->
  <rect x="24" y="60" width="240" height="240" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">マップ</text>
  <rect x="212" y="72" width="40" height="40" rx="8" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-opacity="0.6"/>
  <path d="M226 82 L242 92 L226 102 z" fill="#60a5fa"/>
  <text x="252" y="132" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="end">再生ボタン</text>
  <g fill="#ffffff" fill-opacity="0.4">
    <circle cx="80" cy="170" r="6"/>
    <circle cx="130" cy="230" r="6"/>
    <circle cx="176" cy="186" r="6"/>
    <circle cx="210" cy="256" r="6"/>
    <circle cx="70" cy="262" r="6"/>
  </g>

  <line x1="270" y1="180" x2="306" y2="180" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 軌跡 -->
  <rect x="314" y="60" width="382" height="240" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="330" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">軌跡</text>
  <circle cx="508" cy="82" r="5" fill="#60a5fa"/>
  <text x="518" y="86" fill="#ffffff" fill-opacity="0.6" font-size="11">記録</text>
  <circle cx="566" cy="82" r="5" fill="#ffffff" fill-opacity="0.7"/>
  <text x="576" y="86" fill="#ffffff" fill-opacity="0.6" font-size="11">写真由来の JSON</text>

  <path d="M350 210 L410 150 L470 190 L540 130" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M540 130 L600 170 L660 120" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="4 5"/>
  <circle cx="350" cy="210" r="6" fill="#60a5fa"/>
  <circle cx="410" cy="150" r="6" fill="#60a5fa"/>
  <circle cx="470" cy="190" r="6" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="540" cy="130" r="8" fill="#60a5fa"/>
  <text x="540" y="112" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">日付が進む</text>

  <!-- 操作 -->
  <rect x="330" y="244" width="350" height="40" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <path d="M346 254 L362 264 L346 274 z" fill="#ffffff" fill-opacity="0.85"/>
  <line x1="380" y1="264" x2="570" y2="264" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  <line x1="380" y1="264" x2="490" y2="264" stroke="#60a5fa" stroke-width="4"/>
  <circle cx="490" cy="264" r="7" fill="#60a5fa"/>
  <text x="668" y="268" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="end">再生の長さ ▾</text>
</svg>
