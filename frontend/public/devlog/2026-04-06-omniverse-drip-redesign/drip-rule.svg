<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.4"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">ドリップの決まりを作り直した</text>

  <!-- 変える前 -->
  <text x="24" y="72" fill="#f87171" font-size="12" font-weight="700">変える前</text>
  <rect x="24" y="106" width="100" height="44" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="74" y="133" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">新着</text>
  <line x1="128" y1="120" x2="300" y2="102" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="128" y1="138" x2="300" y2="156" stroke="#f87171" stroke-width="2" marker-end="url(#arrowr)"/>
  <text x="200" y="98" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">閾値以下</text>
  <text x="200" y="170" fill="#f87171" font-size="12" text-anchor="middle">閾値超え</text>
  <rect x="308" y="80" width="250" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="324" y="105" fill="#ffffff" fill-opacity="0.85" font-size="13">1 件ずつ流す</text>
  <rect x="308" y="136" width="250" height="40" rx="8" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.7"/>
  <text x="324" y="161" fill="#f87171" font-size="13">バナーに切替、ドリップ停止</text>

  <!-- 変えた後 -->
  <text x="24" y="216" fill="#60a5fa" font-size="12" font-weight="700">変えた後</text>
  <rect x="24" y="230" width="100" height="44" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="74" y="257" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">新着</text>
  <line x1="128" y1="252" x2="162" y2="252" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="230" width="170" height="44" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="255" y="257" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">キュー(上限 100 件)</text>
  <line x1="344" y1="252" x2="378" y2="252" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="386" y="230" width="310" height="44" rx="8" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="541" y="257" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">トップにいれば常に 1 件ずつ流す</text>
  <text x="696" y="298" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="end">30 件以下は通常 / 31〜100 件は 200ms/件</text>
</svg>
