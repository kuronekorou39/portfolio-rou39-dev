<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.4"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">サイト専用ポリシーと一時許可: 通信先ごとの扱い</text>

  <rect x="24" y="116" width="150" height="100" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="99" y="162" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700" text-anchor="middle">閲覧中のサイト</text>
  <text x="99" y="186" fill="#ffffff" fill-opacity="0.5" font-size="12" text-anchor="middle">から出る通信</text>

  <line x1="178" y1="146" x2="222" y2="98" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrow-dim)"/>
  <line x1="178" y1="166" x2="222" y2="166" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="178" y1="186" x2="222" y2="234" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="13" text-anchor="middle">
    <rect x="228" y="70" width="150" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="303" y="99" fill="#ffffff" fill-opacity="0.7">許可リストにある先</text>
    <line x1="382" y1="94" x2="426" y2="94" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrow-dim)"/>
    <rect x="430" y="70" width="120" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="490" y="99" fill="#ffffff" fill-opacity="0.7">通す</text>

    <rect x="228" y="142" width="150" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="303" y="171" fill="#ffffff" fill-opacity="0.7">未登録の先</text>
    <line x1="382" y1="166" x2="426" y2="166" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="430" y="142" width="120" height="48" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="490" y="171" fill="#60a5fa" font-weight="700">止める</text>

    <rect x="228" y="214" width="150" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="303" y="243" fill="#ffffff" fill-opacity="0.7">一時許可した先</text>
    <line x1="382" y1="238" x2="426" y2="238" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="430" y="214" width="120" height="48" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="490" y="243" fill="#60a5fa" font-weight="700">5 分だけ通す</text>
    <line x1="554" y1="238" x2="592" y2="238" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="596" y="214" width="100" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="646" y="243" fill="#ffffff" fill-opacity="0.85">自動で失効</text>
  </g>
  <text x="566" y="171" fill="#ffffff" fill-opacity="0.5" font-size="12">このサイトの中だけ</text>
  <text x="646" y="284" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">Chrome Alarms</text>
</svg>
