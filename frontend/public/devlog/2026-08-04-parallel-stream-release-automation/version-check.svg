<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">古い拡張機能を、ページが検知して知らせる</text>

  <!-- 拡張 -->
  <rect x="24" y="64" width="220" height="112" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">拡張機能(手動で更新)</text>
  <text x="40" y="122" fill="#ffffff" fill-opacity="0.6" font-size="12">入っている版</text>
  <text x="40" y="154" fill="#ffffff" fill-opacity="0.85" font-size="22" font-weight="700">0.9.6</text>

  <line x1="254" y1="120" x2="466" y2="120" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="106" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">応答に自分の版を載せる</text>

  <!-- ページ -->
  <rect x="476" y="64" width="220" height="112" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="492" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">UI のページ(常に最新)</text>
  <text x="492" y="122" fill="#ffffff" fill-opacity="0.6" font-size="12">期待する版</text>
  <text x="492" y="154" fill="#ffffff" fill-opacity="0.85" font-size="22" font-weight="700">0.9.7</text>

  <line x1="586" y1="176" x2="586" y2="214" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="574" y="200" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="end">突き合わせる</text>

  <!-- 注意 -->
  <rect x="396" y="220" width="300" height="52" rx="10" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="546" y="251" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">拡張機能が古い: 0.9.6 → 0.9.7</text>

  <!-- スクリプト -->
  <rect x="24" y="220" width="300" height="52" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="242" fill="#ffffff" fill-opacity="0.45" font-size="11">リリースのスクリプト</text>
  <text x="40" y="262" fill="#ffffff" fill-opacity="0.6" font-size="12">版番号 3 箇所を一括で書き換える</text>
</svg>
