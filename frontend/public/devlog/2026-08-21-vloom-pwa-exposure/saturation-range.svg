<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, sans-serif">
  <rect width="720" height="290" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">露出ガードが「白飛び」と見なす範囲</text>

  <!-- 直す前 -->
  <text x="108" y="86" fill="#f87171" font-size="12" font-weight="700">直す前: 0.08 を超えたら露出を下げる</text>
  <rect x="108" y="96" width="552" height="20" rx="4" fill="#f87171" fill-opacity="0.45"/>

  <!-- 軸 -->
  <line x1="60" y1="146" x2="660" y2="146" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="2">
    <line x1="60" y1="140" x2="60" y2="152"/>
    <line x1="660" y1="140" x2="660" y2="152"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.45" font-size="12" text-anchor="middle">
    <text x="60" y="170">0</text>
    <text x="660" y="170">1</text>
    <text x="108" y="170" fill="#f87171" fill-opacity="1">0.08</text>
  </g>
  <line x1="108" y1="116" x2="108" y2="152" stroke="#f87171" stroke-width="2"/>
  <text x="236" y="170"fill="#ffffff" fill-opacity="0.45" font-size="12" text-anchor="middle">飽和した画素の割合</text>

  <!-- 直した後 -->
  <rect x="612" y="186" width="48" height="20" rx="4" fill="#60a5fa"/>
  <text x="600" y="201" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="end">直した後: 画面全体がほぼ白のときだけ</text>

  <!-- 白黒コード -->
  <line x1="360" y1="92" x2="360" y2="232" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="360" y="254" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">白黒コード = 0.5(白セルが半分。正常)</text>
</svg>
