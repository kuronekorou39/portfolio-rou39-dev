<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">壊れたフレームから、読めたブロックだけ回収する</text>

  <!-- QR -->
  <rect x="24" y="60" width="324" height="216" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">QR: 1 枚ごとに全か無か</text>
  <rect x="44" y="104" width="150" height="150" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#f87171" stroke-opacity="0.6"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="5">
    <rect x="55" y="115" width="30" height="30"/>
    <rect x="153" y="115" width="30" height="30"/>
    <rect x="55" y="213" width="30" height="30"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.5">
    <rect x="65" y="125" width="10" height="10"/>
    <rect x="163" y="125" width="10" height="10"/>
    <rect x="65" y="223" width="10" height="10"/>
  </g>
  <circle cx="142" cy="196" r="24" fill="#f87171" fill-opacity="0.55"/>
  <text x="214" y="170" fill="#ffffff" fill-opacity="0.6" font-size="13">汚れ 1 箇所で</text>
  <text x="214" y="198" fill="#f87171" font-size="15" font-weight="700">1 枚まるごと失う</text>

  <!-- vcode -->
  <rect x="372" y="60" width="324" height="216" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="388" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">vcode: ブロックごとに CRC (5x4)</text>
  <g fill="#60a5fa" fill-opacity="0.45">
    <rect x="392" y="104" width="34" height="34" rx="3"/><rect x="430" y="104" width="34" height="34" rx="3"/><rect x="468" y="104" width="34" height="34" rx="3"/><rect x="506" y="104" width="34" height="34" rx="3"/><rect x="544" y="104" width="34" height="34" rx="3"/>
    <rect x="392" y="142" width="34" height="34" rx="3"/><rect x="430" y="142" width="34" height="34" rx="3"/><rect x="468" y="142" width="34" height="34" rx="3"/><rect x="506" y="142" width="34" height="34" rx="3"/><rect x="544" y="142" width="34" height="34" rx="3"/>
    <rect x="392" y="180" width="34" height="34" rx="3"/><rect x="430" y="180" width="34" height="34" rx="3"/><rect x="544" y="180" width="34" height="34" rx="3"/>
    <rect x="392" y="218" width="34" height="34" rx="3"/><rect x="430" y="218" width="34" height="34" rx="3"/><rect x="468" y="218" width="34" height="34" rx="3"/><rect x="506" y="218" width="34" height="34" rx="3"/><rect x="544" y="218" width="34" height="34" rx="3"/>
  </g>
  <g fill="#f87171" fill-opacity="0.55">
    <rect x="468" y="180" width="34" height="34" rx="3"/><rect x="506" y="180" width="34" height="34" rx="3"/>
  </g>
  <text x="594" y="170" fill="#ffffff" fill-opacity="0.6" font-size="13">壊れは 2 個</text>
  <text x="594" y="198" fill="#60a5fa" font-size="15" font-weight="700">18 個を回収</text>
</svg>
