<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">全画面の字幕を、自動で隠れる層の外へ出した</text>

  <!-- 直す前 -->
  <text x="24" y="76" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <rect x="24" y="88" width="324" height="198" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="40" y="104" width="292" height="166" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-dasharray="5 4"/>
  <text x="54" y="126" fill="#ffffff" fill-opacity="0.45" font-size="11">自動で隠れる層</text>
  <rect x="56" y="138" width="260" height="40" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <text x="186" y="163" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">操作 UI</text>
  <rect x="96" y="194" width="180" height="36" rx="8" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="186" y="217" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">字幕</text>
  <text x="186" y="254" fill="#f87171" font-size="11" text-anchor="middle">UI と一緒に消える</text>

  <!-- 直した後 -->
  <text x="372" y="76" fill="#60a5fa" font-size="12" font-weight="700">直した後</text>
  <rect x="372" y="88" width="324" height="198" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="388" y="104" width="292" height="84" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-dasharray="5 4"/>
  <text x="402" y="126" fill="#ffffff" fill-opacity="0.45" font-size="11">自動で隠れる層</text>
  <rect x="404" y="138" width="260" height="40" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <text x="534" y="163" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">操作 UI</text>
  <rect x="444" y="204" width="180" height="36" rx="8" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="534" y="227" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">字幕</text>
  <text x="534" y="264" fill="#60a5fa" font-size="11" text-anchor="middle">常時表示の独立レイヤー</text>
</svg>
