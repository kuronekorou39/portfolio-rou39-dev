<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.4"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">ドリップの「トップにいるか」をどこで見るか</text>

  <rect x="24" y="72" width="220" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="98" fill="#ffffff" fill-opacity="0.85" font-size="13">アプリ本体の一覧</text>
  <text x="40" y="118" fill="#ffffff" fill-opacity="0.4" font-size="11">スクロール位置</text>

  <rect x="24" y="184" width="220" height="60" rx="10" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="40" y="210" fill="#60a5fa" font-size="13" font-weight="700">オーバーレイの一覧</text>
  <text x="40" y="230" fill="#ffffff" fill-opacity="0.4" font-size="11">スクロール位置</text>

  <line x1="248" y1="102" x2="392" y2="140" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowg)"/>
  <line x1="248" y1="214" x2="392" y2="176" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="88" fill="#ffffff" fill-opacity="0.4" font-size="11">オーバーレイ使用中は見ない</text>
  <text x="262" y="240" fill="#60a5fa" font-size="11" font-weight="700">使用中はこちらだけで判定</text>

  <rect x="400" y="124" width="150" height="68" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="475" y="154" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">ドリップの判定</text>
  <text x="475" y="175" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">トップにいる?</text>

  <line x1="554" y1="158" x2="588" y2="158" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="596" y="134" width="100" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="646" y="163" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">1 件流す</text>
</svg>
