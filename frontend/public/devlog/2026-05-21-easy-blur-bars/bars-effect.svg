<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <clipPath id="t2"><rect x="280" y="88" width="160" height="114"/></clipPath>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">「黒のり」: 等間隔のバーで隠す</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">明るい面が元の画像</text>

  <!-- 角度 0 -->
  <rect x="40" y="70" width="200" height="150" rx="8" fill="#ffffff" fill-opacity="0.75"/>
  <g fill="#0b0c10">
    <rect x="60" y="90" width="160" height="14"/>
    <rect x="60" y="114" width="160" height="14"/>
    <rect x="60" y="138" width="160" height="14"/>
    <rect x="60" y="162" width="160" height="14"/>
    <rect x="60" y="186" width="160" height="14"/>
  </g>

  <!-- 角度を変える -->
  <rect x="260" y="70" width="200" height="150" rx="8" fill="#ffffff" fill-opacity="0.75"/>
  <g clip-path="url(#t2)" stroke="#0b0c10" stroke-width="14">
    <line x1="304" y1="2" x2="512" y2="122"/>
    <line x1="292" y1="23" x2="500" y2="143"/>
    <line x1="280" y1="43" x2="488" y2="163"/>
    <line x1="268" y1="64" x2="476" y2="184"/>
    <line x1="256" y1="85" x2="464" y2="205"/>
    <line x1="244" y1="106" x2="452" y2="226"/>
    <line x1="232" y1="127" x2="440" y2="247"/>
    <line x1="220" y1="147" x2="428" y2="267"/>
    <line x1="208" y1="168" x2="416" y2="288"/>
  </g>
  <rect x="260" y="70" width="200" height="150" rx="8" fill="none" stroke="#60a5fa" stroke-width="2"/>

  <!-- 密度 -->
  <rect x="480" y="70" width="200" height="150" rx="8" fill="#ffffff" fill-opacity="0.75"/>
  <g fill="#0b0c10">
    <rect x="500" y="93" width="160" height="7"/>
    <rect x="500" y="105" width="160" height="7"/>
    <rect x="500" y="117" width="160" height="7"/>
    <rect x="500" y="129" width="160" height="7"/>
    <rect x="500" y="141" width="160" height="7"/>
    <rect x="500" y="153" width="160" height="7"/>
    <rect x="500" y="165" width="160" height="7"/>
    <rect x="500" y="177" width="160" height="7"/>
    <rect x="500" y="189" width="160" height="7"/>
  </g>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="140" y="248" fill="#ffffff" fill-opacity="0.85">角度 0(既定)</text>
    <text x="360" y="248" fill="#60a5fa">角度を変える</text>
    <text x="580" y="248" fill="#ffffff" fill-opacity="0.85">密度を上げる</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#ffffff" fill-opacity="0.6">
    <text x="140" y="270">色は「塗り」と共用</text>
    <text x="360" y="270">黒のり専用の項目</text>
    <text x="580" y="270">「強度」の項目で変える</text>
  </g>
</svg>
