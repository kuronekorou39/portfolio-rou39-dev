    <rect x="24" y="64" width="126" height="76" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
    <text x="87" y="96" fill="#ffffff" fill-opacity="0.85">コンテンツスクリプト</text>
    <rect x="160" y="64" width="126" height="76" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
    <text x="223" y="96" fill="#ffffff" fill-opacity="0.85">ポップアップ</text>
    <rect x="296" y="64" width="126" height="76" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
    <text x="359" y="96" fill="#ffffff" fill-opacity="0.85">サイドパネル</text>
    <rect x="432" y="64" width="126" height="76" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
