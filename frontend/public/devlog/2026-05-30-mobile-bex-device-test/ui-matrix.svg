    <text x="223" y="120" fill="#60a5fa">PASS</text>
    <text x="359" y="120" fill="#60a5fa">PASS</text>
    <text x="495" y="120" fill="#60a5fa">PASS</text>
    <text x="631" y="120" fill="#60a5fa">PASS</text>
