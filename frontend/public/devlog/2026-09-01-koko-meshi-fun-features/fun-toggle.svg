<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">設定でオンにしたときだけ、再生ボタンが出る</text>

  <!-- 設定 -->
  <rect x="24" y="60" width="360" height="216" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">設定</text>
  <text x="40" y="122" fill="#60a5fa" font-size="12" font-weight="700">遊び要素</text>
  <rect x="40" y="134" width="328" height="112" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="56" y="164" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700">軌跡の再生</text>
  <text x="56" y="186" fill="#ffffff" fill-opacity="0.4" font-size="11">既定はオフ</text>
  <rect x="306" y="150" width="46" height="24" rx="12" fill="#60a5fa"/>
  <circle cx="340" cy="162" r="9" fill="#ffffff"/>
  <line x1="56" y1="202" x2="352" y2="202" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <text x="56" y="228" fill="#ffffff" fill-opacity="0.6" font-size="12">マップの右上に再生ボタンが出ます</text>

  <line x1="390" y1="168" x2="426" y2="168" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="154" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">すぐ反映</text>

  <!-- マップ -->
  <rect x="434" y="60" width="262" height="216" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="450" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">マップ</text>
  <rect x="644" y="72" width="40" height="40" rx="8" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-opacity="0.6"/>
  <path d="M658 82 L674 92 L658 102 z" fill="#60a5fa"/>
  <text x="684" y="132" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="end">再生ボタン</text>
  <g fill="#ffffff" fill-opacity="0.4">
    <circle cx="490" cy="170" r="6"/>
    <circle cx="548" cy="226" r="6"/>
    <circle cx="600" cy="182" r="6"/>
    <circle cx="640" cy="244" r="6"/>
  </g>
</svg>
