<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">いいねの状態を、真偽値からアカウントの集合へ</text>

  <!-- データの形 -->
  <rect x="24" y="60" width="290" height="76" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="92" fill="#ffffff" fill-opacity="0.85" font-size="14" font-family="ui-monospace, monospace">isLiked: true</text>
  <text x="40" y="118" fill="#f87171" font-size="12">どのアカウントのいいねか分からない</text>
  <line x1="320" y1="98" x2="388" y2="98" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="396" y="60" width="300" height="76" rx="10" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="412" y="92" fill="#60a5fa" font-size="14" font-weight="700" font-family="ui-monospace, monospace">likedByAccountIds: {A, C}</text>
  <text x="412" y="118" fill="#ffffff" fill-opacity="0.6" font-size="12">いいね済みのアカウント ID の集合</text>

  <!-- ボタンの 3 段階 -->
  <text x="24" y="176" fill="#ffffff" fill-opacity="0.45" font-size="12">ボタンの表示(取得したアカウントのうち)</text>
  <g fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="24" y="190" width="212" height="100" rx="10"/>
    <rect x="254" y="190" width="212" height="100" rx="10"/>
    <rect x="484" y="190" width="212" height="100" rx="10"/>
  </g>
  <circle cx="60" cy="240" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="290" cy="240" r="16" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M290 224 A16 16 0 0 0 290 256 z" fill="#60a5fa"/>
  <circle cx="520" cy="240" r="16" fill="#60a5fa"/>
  <g font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.85">
    <text x="92" y="236">なし</text>
    <text x="322" y="236">一部</text>
    <text x="552" y="236">全部</text>
  </g>
  <g font-size="12" fill="#ffffff" fill-opacity="0.6">
    <text x="92" y="258">誰も付けていない</text>
    <text x="322" y="258">一部だけ付けた</text>
    <text x="552" y="258">全員が付けた</text>
  </g>
</svg>
