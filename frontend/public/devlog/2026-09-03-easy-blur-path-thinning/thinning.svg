<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">ドラッグで増えた経路の点を間引く</text>

  <!-- 記録した経路 -->
  <rect x="24" y="58" width="300" height="228" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="84" fill="#ffffff" fill-opacity="0.45" font-size="12">記録した経路</text>
  <rect x="156" y="68" width="156" height="26" rx="13" fill="#60a5fa" fill-opacity="0.25"/>
  <text x="234" y="86" fill="#ffffff" fill-opacity="0.85" font-size="12" font-weight="700" text-anchor="middle">経路を記録中 · 16点</text>
  <polyline points="50,250 64,229 78,206 92,185 106,161 120,140 136,155 152,167 168,183 184,195 200,210 222,193 244,174 266,157 288,137 306,120" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <g fill="#ffffff" fill-opacity="0.7">
    <circle cx="50" cy="250" r="4"/><circle cx="64" cy="229" r="4"/><circle cx="78" cy="206" r="4"/>
    <circle cx="92" cy="185" r="4"/><circle cx="106" cy="161" r="4"/><circle cx="120" cy="140" r="4"/>
    <circle cx="136" cy="155" r="4"/><circle cx="152" cy="167" r="4"/><circle cx="168" cy="183" r="4"/>
    <circle cx="184" cy="195" r="4"/><circle cx="200" cy="210" r="4"/><circle cx="222" cy="193" r="4"/>
    <circle cx="244" cy="174" r="4"/><circle cx="266" cy="157" r="4"/><circle cx="288" cy="137" r="4"/>
    <circle cx="306" cy="120" r="4"/>
  </g>

  <line x1="334" y1="172" x2="382" y2="172" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 間引いた後 -->
  <rect x="396" y="58" width="300" height="228" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="412" y="84" fill="#60a5fa" font-size="12" font-weight="700">間引いた後 · 4点</text>
  <polyline points="422,250 492,140 572,210 678,120" fill="none" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="2"/>
  <g fill="#60a5fa">
    <circle cx="422" cy="250" r="6"/><circle cx="492" cy="140" r="6"/><circle cx="572" cy="210" r="6"/><circle cx="678" cy="120" r="6"/>
  </g>
  <text x="680" y="270" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">形と時刻を保つ点だけ残す</text>
</svg>
