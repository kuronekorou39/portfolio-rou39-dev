<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="system-ui, sans-serif">
  <rect width="720" height="230" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">全パスしたテストの件数</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">155 件の失敗を直してから積み増した</text>
  <g font-size="13">
    <text x="24" y="85" fill="#ffffff" fill-opacity="0.6">失敗を修正</text>
    <rect x="180" y="68" width="387" height="26" rx="4" fill="#60a5fa" fill-opacity="0.45"/>
    <text x="577" y="86" fill="#ffffff" fill-opacity="0.7">655</text>

    <text x="24" y="135" fill="#ffffff" fill-opacity="0.6">未テストの 4 ファイル</text>
    <rect x="180" y="118" width="426" height="26" rx="4" fill="#60a5fa" fill-opacity="0.65"/>
    <text x="616" y="136" fill="#ffffff" fill-opacity="0.7">720</text>

    <text x="24" y="185" fill="#ffffff" fill-opacity="0.6">価値の高い箇所</text>
    <rect x="180" y="168" width="480" height="26" rx="4" fill="#60a5fa"/>
    <text x="670" y="186" fill="#ffffff" font-weight="700">812</text>
  </g>
</svg>
