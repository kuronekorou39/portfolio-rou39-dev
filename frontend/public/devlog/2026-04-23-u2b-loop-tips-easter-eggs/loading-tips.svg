<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="370" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">ローディング画面の Tips と隠し要素</text>

  <!-- ローディング画面 -->
  <text x="150" y="78" fill="#ffffff" fill-opacity="0.45" font-size="12" text-anchor="middle">ローディング画面</text>
  <rect x="40" y="90" width="220" height="256" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="56" y="106" width="188" height="120" rx="8" fill="#ffffff" fill-opacity="0.08"/>
  <path d="M96 166V166 M108 152V180 M120 140V192 M132 156V176 M144 146V186 M156 134V198 M168 150V182 M180 160V172 M192 144V188 M204 156V176" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" fill="none"/>
  <text x="150" y="216" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">アニメーション</text>
  <rect x="56" y="240" width="188" height="90" rx="8" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="72" y="268" fill="#60a5fa" font-size="14" font-weight="700">Tips</text>
  <text x="72" y="292" fill="#ffffff" fill-opacity="0.85" font-size="12">187 種からランダム</text>
  <text x="72" y="314" fill="#ffffff" fill-opacity="0.6" font-size="12">8 秒ごとに切り替え</text>

  <!-- ヒント -->
  <line x1="252" y1="286" x2="352" y2="220" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- 隠し要素 -->
  <rect x="360" y="90" width="336" height="256" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="376" y="116" fill="#ffffff" fill-opacity="0.45" font-size="12">隠し要素(解放のヒントを Tips に 3 つ)</text>
  <rect x="376" y="130" width="304" height="58" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="392" y="155" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">隠しステータス画面</text>
  <text x="392" y="175" fill="#ffffff" fill-opacity="0.4" font-size="11">総再生回数 / 推定練習時間 など</text>
  <rect x="376" y="200" width="304" height="58" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="392" y="225" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">カセットテープ</text>
  <text x="392" y="245" fill="#ffffff" fill-opacity="0.4" font-size="11">ローディングアニメーション</text>
  <rect x="376" y="270" width="304" height="58" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="392" y="295" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">マトリックスモード</text>
  <text x="392" y="315" fill="#ffffff" fill-opacity="0.4" font-size="11">10 秒間、文字が降る</text>
</svg>
