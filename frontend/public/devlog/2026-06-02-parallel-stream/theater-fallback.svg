<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.4"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">シアターモードを入れる 3 つの手を順に試す</text>

  <rect x="24" y="72" width="180" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="114" y="99" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">1</text>
  <text x="114" y="118" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700" text-anchor="middle">ボタンを押す</text>

  <line x1="206" y1="102" x2="266" y2="102" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="236" y="92" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">だめなら</text>

  <rect x="270" y="72" width="180" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="360" y="99" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">2</text>
  <text x="360" y="118" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700" text-anchor="middle">属性を書き換える</text>

  <line x1="452" y1="102" x2="512" y2="102" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="482" y="92" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">だめなら</text>

  <rect x="516" y="72" width="180" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="606" y="99" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">3</text>
  <text x="606" y="118" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700" text-anchor="middle">キーを送る</text>

  <!-- 効いたら止める -->
  <line x1="114" y1="134" x2="114" y2="196" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="360" y1="134" x2="360" y2="196" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="606" y1="134" x2="606" y2="196" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="24" y="200" width="672" height="40" rx="10" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="360" y="225" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">効いた時点で止める</text>
</svg>
