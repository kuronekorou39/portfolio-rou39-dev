<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="270" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">100 件の取り込みで飛ぶリクエスト</text>

  <!-- 直す前 -->
  <text x="24" y="80" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <rect x="24" y="92" width="160" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="104" y="121" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">プレイリスト列挙</text>
  <line x1="190" y1="116" x2="208" y2="116" stroke="#f87171" stroke-width="2" marker-end="url(#arrowr)"/>
  <rect x="214" y="92" width="200" height="48" rx="8" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="314" y="121" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">動画ごとに再取得 ×100</text>
  <line x1="420" y1="116" x2="438" y2="116" stroke="#f87171" stroke-width="2" marker-end="url(#arrowr)"/>
  <rect x="444" y="92" width="100" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="494" y="121" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">保存</text>
  <text x="696" y="124" fill="#f87171" font-size="20" font-weight="700" text-anchor="end">200 以上</text>

  <!-- 直した後 -->
  <text x="24" y="180" fill="#60a5fa" font-size="12" font-weight="700">直した後</text>
  <rect x="24" y="192" width="160" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="104" y="221" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">プレイリスト列挙</text>
  <line x1="190" y1="216" x2="208" y2="216" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="214" y="192" width="330" height="48" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="379" y="221" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">列挙で得た動画情報をそのまま保存</text>
  <text x="696" y="224" fill="#60a5fa" font-size="20" font-weight="700" text-anchor="end">100 以下</text>
</svg>
