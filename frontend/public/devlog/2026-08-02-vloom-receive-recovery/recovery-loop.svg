<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">見失ってから復帰するまで</text>

  <text x="24" y="74" fill="#ffffff" fill-opacity="0.45" font-size="12">直す前: 抜け出せない</text>
  <g text-anchor="middle">
    <rect x="24" y="84" width="200" height="60" rx="8" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.6"/>
    <text x="124" y="110" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">フル探索</text>
    <text x="124" y="131" fill="#ffffff" fill-opacity="0.5" font-size="12">1 枚 300ms</text>
    <rect x="260" y="84" width="200" height="60" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="360" y="110" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">その間にカメラが進む</text>
    <text x="360" y="131" fill="#ffffff" fill-opacity="0.5" font-size="12">10 フレーム</text>
    <rect x="496" y="84" width="200" height="60" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="596" y="119" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">位置がずれている</text>
  </g>
  <g stroke="#f87171" stroke-width="2" fill="none">
    <line x1="226" y1="114" x2="256" y2="114" marker-end="url(#arrowRed)"/>
    <line x1="462" y1="114" x2="492" y2="114" marker-end="url(#arrowRed)"/>
    <path d="M596 146 V172 H124 V150" marker-end="url(#arrowRed)"/>
  </g>
  <text x="360" y="192" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">また探索し直す</text>

  <text x="24" y="226" fill="#ffffff" fill-opacity="0.45" font-size="12">直した後</text>
  <g text-anchor="middle">
    <rect x="24" y="236" width="200" height="60" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="124" y="262" fill="#60a5fa" font-size="13" font-weight="700">locate_code</text>
    <text x="124" y="283" fill="#ffffff" fill-opacity="0.6" font-size="12">テクスチャから位置を推定</text>
    <rect x="260" y="236" width="200" height="60" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="360" y="262" fill="#60a5fa" font-size="13" font-weight="700">軽い探索</text>
    <text x="360" y="283" fill="#ffffff" fill-opacity="0.6" font-size="12">総当たり 6 → 2 通り</text>
    <rect x="496" y="236" width="200" height="60" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="596" y="262" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">追従に復帰</text>
    <text x="596" y="283" fill="#ffffff" fill-opacity="0.6" font-size="12">検出率 41% → 74%</text>
  </g>
  <g stroke="#60a5fa" stroke-width="2">
    <line x1="226" y1="266" x2="256" y2="266" marker-end="url(#arrow)"/>
    <line x1="462" y1="266" x2="492" y2="266" marker-end="url(#arrow)"/>
  </g>
</svg>
