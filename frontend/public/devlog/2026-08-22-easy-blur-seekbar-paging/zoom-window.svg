<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">ズーム中のシークバー: 再生中の動き</text>

  <!-- 前 -->
  <text x="24" y="104" fill="#f87171" font-size="13" font-weight="700">前</text>
  <rect x="80" y="84" width="616" height="32" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="2">
    <line x1="140" y1="92" x2="140" y2="108"/><line x1="220" y1="92" x2="220" y2="108"/>
    <line x1="300" y1="92" x2="300" y2="108"/><line x1="476" y1="92" x2="476" y2="108"/>
    <line x1="556" y1="92" x2="556" y2="108"/><line x1="636" y1="92" x2="636" y2="108"/>
  </g>
  <line x1="340" y1="100" x2="256" y2="100" stroke="#f87171" stroke-width="2" marker-end="url(#red)"/>
  <line x1="520" y1="100" x2="436" y2="100" stroke="#f87171" stroke-width="2" marker-end="url(#red)"/>
  <circle cx="388" cy="100" r="11" fill="#f87171"/>
  <text x="80" y="140" fill="#f87171" font-size="12">つまみは中央に固定。背景だけが流れる</text>

  <!-- 後 -->
  <text x="24" y="214" fill="#60a5fa" font-size="13" font-weight="700">後</text>
  <rect x="80" y="194" width="270" height="32" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <line x1="100" y1="210" x2="300" y2="210" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="320" cy="210" r="11" fill="#60a5fa"/>
  <text x="80" y="184" fill="#ffffff" fill-opacity="0.45" font-size="12">窓は固定。つまみが動く</text>

  <line x1="362" y1="210" x2="412" y2="210" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="426" y="194" width="270" height="32" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <circle cx="456" cy="210" r="11" fill="#60a5fa"/>
  <text x="426" y="184" fill="#ffffff" fill-opacity="0.45" font-size="12">次のページ</text>
  <text x="388" y="254" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">右端を越えたら切り替え</text>
  <text x="426" y="278" fill="#ffffff" fill-opacity="0.6" font-size="12">再生位置は左端付近に置き直す</text>
</svg>
