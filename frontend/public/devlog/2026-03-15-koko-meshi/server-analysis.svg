<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.4"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">AI の API キーをアプリから外す</text>

  <!-- 前 -->
  <text x="24" y="104" fill="#ffffff" fill-opacity="0.4" font-size="13" font-weight="700">前</text>
  <rect x="70" y="72" width="220" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#f87171" stroke-opacity="0.5"/>
  <text x="180" y="98" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">アプリ</text>
  <text x="180" y="117" fill="#f87171" font-size="11" text-anchor="middle">キーを中に持つ</text>
  <line x1="292" y1="100" x2="566" y2="100" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="72" width="126" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="633" y="105" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">AI</text>

  <!-- 後 -->
  <text x="24" y="214" fill="#60a5fa" font-size="13" font-weight="700">後</text>
  <rect x="70" y="182" width="150" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="145" y="208" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">アプリ</text>
  <text x="145" y="227" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">写真を送るだけ</text>
  <line x1="222" y1="210" x2="282" y2="210" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="286" y="170" width="230" height="80" rx="10" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="401" y="198" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">サーバー側の関数</text>
  <text x="401" y="219" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">キーを持つ</text>
  <text x="401" y="238" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">回数の上限を数える</text>
  <line x1="518" y1="210" x2="566" y2="210" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="570" y="182" width="126" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="633" y="215" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">AI</text>
</svg>
