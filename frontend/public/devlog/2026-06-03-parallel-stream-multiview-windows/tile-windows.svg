<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">配信 URL から、タイル配置の popup ウィンドウへ</text>

  <!-- ポップアップ -->
  <rect x="24" y="64" width="200" height="220" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">拡張のポップアップ</text>
  <g fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2">
    <rect x="40" y="106" width="168" height="32" rx="6"/>
    <rect x="40" y="148" width="168" height="32" rx="6"/>
    <rect x="40" y="190" width="168" height="32" rx="6"/>
    <rect x="40" y="232" width="168" height="32" rx="6"/>
  </g>
  <g font-size="12" fill="#ffffff" fill-opacity="0.6">
    <text x="52" y="127">配信 URL 1</text>
    <text x="52" y="169">配信 URL 2</text>
    <text x="52" y="211">配信 URL 3</text>
    <text x="52" y="253">配信 URL 4</text>
  </g>

  <!-- 開く -->
  <line x1="234" y1="174" x2="366" y2="174" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="160" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">1〜4 分割で開く</text>
  <text x="300" y="196" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">各タブに注入</text>

  <!-- 画面 -->
  <rect x="376" y="64" width="320" height="220" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <g fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6">
    <rect x="388" y="76" width="144" height="94" rx="6"/>
    <rect x="540" y="76" width="144" height="94" rx="6"/>
    <rect x="388" y="178" width="144" height="94" rx="6"/>
    <rect x="540" y="178" width="144" height="94" rx="6"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.15">
    <line x1="388" y1="92" x2="532" y2="92"/>
    <line x1="540" y1="92" x2="684" y2="92"/>
    <line x1="388" y1="194" x2="532" y2="194"/>
    <line x1="540" y1="194" x2="684" y2="194"/>
  </g>
  <g font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">
    <text x="460" y="138">シアター ON</text>
    <text x="612" y="138">シアター ON</text>
    <text x="460" y="240">シアター ON</text>
    <text x="612" y="240">シアター ON</text>
  </g>
</svg>
