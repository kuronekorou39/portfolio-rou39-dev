<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">README を 2 つに分け、ZIP にも同梱する</text>

  <!-- 元の README -->
  <rect x="24" y="64" width="190" height="200" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">これまでの README</text>
  <rect x="40" y="102" width="158" height="30" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <text x="54" y="122" fill="#ffffff" fill-opacity="0.6" font-size="12">概要</text>
  <rect x="40" y="140" width="158" height="108" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <text x="54" y="198" fill="#ffffff" fill-opacity="0.6" font-size="12">詳細な使い方</text>

  <line x1="218" y1="118" x2="276" y2="118" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="218" y1="212" x2="276" y2="212" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 分けた後 -->
  <rect x="280" y="64" width="200" height="92" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="296" y="92" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">README.md</text>
  <text x="296" y="116" fill="#ffffff" fill-opacity="0.6" font-size="12">概要(簡潔に)</text>
  <text x="296" y="138" fill="#60a5fa" font-size="12" font-weight="700">＋ ZIP から入れる手順</text>

  <rect x="280" y="172" width="200" height="92" rx="10" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="296" y="200" fill="#60a5fa" font-size="13" font-weight="700">docs/USAGE.md</text>
  <text x="296" y="226" fill="#ffffff" fill-opacity="0.6" font-size="12">詳細な使い方</text>

  <line x1="484" y1="218" x2="542" y2="186" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ZIP -->
  <rect x="548" y="104" width="148" height="120" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="622" y="136" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">リリースの ZIP</text>
  <text x="622" y="166" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">拡張機能の本体</text>
  <text x="622" y="194" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">＋ docs/ を同梱</text>
</svg>
