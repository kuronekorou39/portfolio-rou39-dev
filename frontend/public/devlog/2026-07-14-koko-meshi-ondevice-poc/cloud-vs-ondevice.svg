<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.4"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">写真の判定: クラウドと端末内の 2 経路</text>

  <!-- 写真 -->
  <rect x="24" y="126" width="130" height="70" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="89" y="166" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">料理の写真</text>

  <!-- 従来 -->
  <line x1="158" y1="146" x2="232" y2="100" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrow-dim)"/>
  <rect x="240" y="64" width="200" height="64" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="256" y="90" fill="#ffffff" fill-opacity="0.4" font-size="11">従来</text>
  <text x="256" y="112" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">クラウドの AI</text>
  <line x1="444" y1="98" x2="612" y2="144" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrow-dim)"/>

  <text x="340" y="162" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">同じプロンプト</text>

  <!-- PoC -->
  <line x1="158" y1="176" x2="232" y2="222" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="190" width="200" height="80" rx="10" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="256" y="216" fill="#60a5fa" font-size="11" font-weight="700">今回の PoC</text>
  <text x="256" y="238" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">端末内の Gemma 4</text>
  <text x="256" y="258" fill="#ffffff" fill-opacity="0.6" font-size="12">E2B / E4B を切り替え</text>
  <line x1="444" y1="230" x2="476" y2="230" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="484" y="198" width="112" height="64" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="540" y="226" fill="#ffffff" fill-opacity="0.85" font-size="12" text-anchor="middle">JSON を</text>
  <text x="540" y="246" fill="#ffffff" fill-opacity="0.85" font-size="12" text-anchor="middle">自前でパース</text>
  <line x1="600" y1="216" x2="640" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 結果 -->
  <rect x="616" y="126" width="80" height="70" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="656" y="166" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">判定結果</text>
</svg>
