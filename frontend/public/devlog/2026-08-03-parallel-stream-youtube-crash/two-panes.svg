<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">YouTube の枠: 視聴ページから 2 枚組へ</text>

  <!-- 前 -->
  <text x="24" y="72" fill="#ffffff" fill-opacity="0.45" font-size="12">前: 視聴ページを丸ごと 1 つの iframe に</text>
  <rect x="24" y="84" width="316" height="184" rx="6" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.7"/>
  <g stroke="#f87171" stroke-width="3" stroke-linecap="round">
    <line x1="166" y1="140" x2="198" y2="172"/>
    <line x1="198" y1="140" x2="166" y2="172"/>
  </g>
  <text x="182" y="206" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">レンダラが落ちる</text>
  <text x="182" y="228" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">最小ページでも 6/6 で再現</text>

  <line x1="346" y1="176" x2="372" y2="176" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 後 -->
  <text x="380" y="72" fill="#ffffff" fill-opacity="0.45" font-size="12">後: 1 つの枠に iframe を 2 枚</text>
  <rect x="380" y="84" width="316" height="184" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.2"/>
  <g fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.7">
    <rect x="390" y="94" width="196" height="164" rx="4"/>
    <rect x="594" y="94" width="92" height="164" rx="4"/>
  </g>
  <g font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">
    <text x="488" y="174">埋め込みプレイヤー</text>
    <text x="640" y="174">チャット</text>
  </g>
  <text x="488" y="196" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">公式の埋め込み</text>
  <text x="380" y="294" fill="#ffffff" fill-opacity="0.6" font-size="12">Twitch も同じ 2 枚組に揃えた</text>
</svg>
