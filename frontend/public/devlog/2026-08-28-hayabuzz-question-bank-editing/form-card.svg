<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, sans-serif">
  <rect width="720" height="400" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">問題集: 一覧と、別カードにした編集フォーム</text>

  <rect x="120" y="56" width="320" height="326" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- 見出し -->
  <rect x="120" y="56" width="320" height="36" rx="10" fill="#ffffff" fill-opacity="0.08"/>
  <text x="136" y="79" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">問題集</text>

  <!-- 一覧 -->
  <g font-size="12">
    <rect x="132" y="100" width="296" height="44" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="146" y="118" width="170" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <text x="414" y="127" fill="#ffffff" fill-opacity="0.6" text-anchor="end">編集</text>
    <rect x="132" y="154" width="296" height="44" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="146" y="172" width="130" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <text x="414" y="181" fill="#60a5fa" font-weight="700" text-anchor="end">編集</text>
    <rect x="132" y="208" width="296" height="44" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="146" y="226" width="190" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <text x="414" y="235" fill="#ffffff" fill-opacity="0.6" text-anchor="end">編集</text>
  </g>

  <!-- フォーム -->
  <rect x="128" y="268" width="308" height="108" rx="10" fill="#000000" fill-opacity="0.6"/>
  <rect x="126" y="262" width="308" height="108" rx="10" fill="#0b0c10" stroke="#60a5fa"/>
  <text x="140" y="284" fill="#60a5fa" font-size="12" font-weight="700">編集フォーム</text>
  <rect x="140" y="294" width="280" height="28" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="150" y="304" width="130" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="320" y="330" width="100" height="30" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
  <text x="370" y="350" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">保存する</text>

  <!-- 注記 -->
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="2">
    <line x1="444" y1="74" x2="468" y2="74"/>
    <line x1="444" y1="176" x2="468" y2="176"/>
    <line x1="444" y1="257" x2="468" y2="257"/>
    <line x1="444" y1="316" x2="468" y2="316"/>
  </g>
  <g font-size="12" fill="#ffffff" fill-opacity="0.6">
    <text x="476" y="78">見出しは上部に固定</text>
    <text x="476" y="180">開閉しても一覧は動かない</text>
    <text x="476" y="261">10px の隙間と影で浮かす</text>
    <text x="476" y="320" fill="#60a5fa" fill-opacity="1" font-weight="700">編集中は枠が青い</text>
  </g>
  <text x="476" y="340" fill="#ffffff" fill-opacity="0.4" font-size="11">開閉は 0.28 秒のスライド</text>
</svg>
