<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">Google 認証のポップアップを、別の WebView で受ける</text>

  <!-- ログイン用 WebView -->
  <rect x="24" y="60" width="200" height="226" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">ログイン用の WebView</text>
  <rect x="40" y="104" width="168" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="40" y="124" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="40" y="156" width="168" height="38" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="124" y="180" fill="#ffffff" fill-opacity="0.85" font-size="12" text-anchor="middle">Google でログイン</text>

  <line x1="212" y1="175" x2="304" y2="175" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="164" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">ポップアップ</text>

  <!-- ダイアログ -->
  <rect x="312" y="84" width="196" height="182" rx="10" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="328" y="110" fill="#60a5fa" font-size="13" font-weight="700">ダイアログ内の</text>
  <text x="328" y="130" fill="#60a5fa" font-size="13" font-weight="700">新しい WebView</text>
  <rect x="328" y="146" width="164" height="104" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="410" y="203" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">Google の認証</text>

  <line x1="512" y1="175" x2="558" y2="175" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 閉じたあと -->
  <g fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="566" y="84" width="130" height="44" rx="8"/>
    <rect x="566" y="153" width="130" height="44" rx="8"/>
    <rect x="566" y="222" width="130" height="44" rx="8"/>
  </g>
  <g font-size="12" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">
    <text x="631" y="110">閉じたのを検知</text>
    <text x="631" y="179">3 秒待って確認</text>
    <text x="631" y="248">追加の確認モーダル</text>
  </g>
  <line x1="631" y1="130" x2="631" y2="149" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="631" y1="199" x2="631" y2="218" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
