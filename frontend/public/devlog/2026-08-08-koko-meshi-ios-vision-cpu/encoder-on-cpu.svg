<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">モデルのどの部分をどこで動かすか</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">iPhone 12 Pro</text>

  <!-- 前 -->
  <rect x="24" y="60" width="316" height="220" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">直す前</text>
  <rect x="40" y="98" width="180" height="166" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="52" y="120" fill="#ffffff" fill-opacity="0.45" font-size="12">GPU</text>
  <rect x="52" y="130" width="156" height="62" rx="8" fill="#ffffff" fill-opacity="0.18"/>
  <text x="130" y="157" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">モデル本体</text>
  <text x="130" y="178" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">2.4GB</text>
  <rect x="52" y="200" width="156" height="54" rx="8" fill="#0b0c10" stroke="#f87171" stroke-opacity="0.7" stroke-dasharray="4 5"/>
  <text x="130" y="223" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">画像エンコーダ</text>
  <text x="130" y="243" fill="#f87171" font-size="12" text-anchor="middle">メモリ確保に失敗</text>
  <rect x="232" y="98" width="92" height="166" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="244" y="120" fill="#ffffff" fill-opacity="0.45" font-size="12">CPU</text>

  <line x1="344" y1="170" x2="372" y2="170" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 後 -->
  <rect x="380" y="60" width="316" height="220" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="396" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">iOS での設定</text>
  <rect x="396" y="98" width="180" height="166" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="408" y="120" fill="#ffffff" fill-opacity="0.45" font-size="12">GPU</text>
  <rect x="408" y="130" width="156" height="62" rx="8" fill="#ffffff" fill-opacity="0.18"/>
  <text x="486" y="157" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">モデル本体</text>
  <text x="486" y="178" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">2.4GB</text>
  <rect x="588" y="98" width="92" height="166" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="600" y="120" fill="#ffffff" fill-opacity="0.45" font-size="12">CPU</text>
  <rect x="596" y="130" width="76" height="62" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
  <text x="634" y="157" fill="#ffffff" fill-opacity="0.85" font-size="12" font-weight="700" text-anchor="middle">画像</text>
  <text x="634" y="176" fill="#ffffff" fill-opacity="0.85" font-size="12" font-weight="700" text-anchor="middle">エンコーダ</text>
  <text x="634" y="218" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">画像 1 枚に</text>
  <text x="634" y="236" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">1 回だけ</text>
</svg>
