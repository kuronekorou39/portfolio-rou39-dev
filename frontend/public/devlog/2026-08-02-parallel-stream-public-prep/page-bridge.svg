<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">UI を通常のページへ移し、chrome.* は橋渡しで中継</text>

  <!-- 前 -->
  <rect x="24" y="58" width="672" height="46" rx="10" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.5"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.6" font-size="12">前: UI は拡張ページの中</text>
  <text x="680" y="86" fill="#f87171" font-size="12" text-anchor="end">枠の中に他の拡張が届かない</text>

  <!-- 後 -->
  <text x="24" y="136" fill="#ffffff" fill-opacity="0.45" font-size="12">後</text>
  <g fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="24" y="150" width="190" height="96" rx="10"/>
    <rect x="506" y="150" width="190" height="96" rx="10"/>
  </g>
  <rect x="265" y="150" width="190" height="96" rx="10" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"/>
  <g font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">
    <text x="119" y="192">UI のページ</text>
    <text x="360" y="192">橋渡しのスクリプト</text>
    <text x="601" y="192">拡張機能</text>
  </g>
  <g font-size="12" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">
    <text x="119" y="216">https の通常ページ</text>
    <text x="360" y="216">送信元を確認</text>
    <text x="601" y="216">chrome.* を呼ぶ</text>
  </g>
  <g stroke="#60a5fa" stroke-width="2">
    <line x1="218" y1="188" x2="259" y2="188" marker-end="url(#arrow)"/>
    <line x1="261" y1="210" x2="220" y2="210" marker-end="url(#arrow)"/>
    <line x1="459" y1="188" x2="500" y2="188" marker-end="url(#arrow)"/>
    <line x1="502" y1="210" x2="461" y2="210" marker-end="url(#arrow)"/>
  </g>
  <text x="24" y="276" fill="#ffffff" fill-opacity="0.4" font-size="11">UI のページの枠には、他の拡張の content script も届く</text>
</svg>
