<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">画像 4 枚を X の投稿画面へ渡す順序</text>

  <!-- 直す前 -->
  <text x="24" y="80" fill="#f87171" font-size="12" font-weight="700">直す前: 固定の待ち時間</text>
  <g font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">
    <rect x="24" y="92" width="40" height="40" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="44" y="117">1</text>
    <rect x="124" y="92" width="40" height="40" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="144" y="117">2</text>
    <rect x="224" y="92" width="40" height="40" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="244" y="117">3</text>
    <rect x="324" y="92" width="40" height="40" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="344" y="117">4</text>
  </g>
  <g stroke="#f87171" stroke-width="2">
    <line x1="68" y1="116" x2="120" y2="116" marker-end="url(#r)"/>
    <line x1="168" y1="116" x2="220" y2="116" marker-end="url(#r)"/>
    <line x1="268" y1="116" x2="320" y2="116" marker-end="url(#r)"/>
    <line x1="368" y1="116" x2="428" y2="116" marker-end="url(#r)"/>
  </g>
  <g font-size="11" fill="#f87171" text-anchor="middle">
    <text x="94" y="106">1.2 秒</text>
    <text x="194" y="106">1.2 秒</text>
    <text x="294" y="106">1.2 秒</text>
  </g>
  <rect x="432" y="88" width="264" height="48" rx="8" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="564" y="117" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">2〜3 枚しか付かない</text>

  <!-- 直した後 -->
  <text x="24" y="186" fill="#60a5fa" font-size="12" font-weight="700">直した後: プレビューの枚数が増えるまで待つ</text>
  <g font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">
    <rect x="24" y="210" width="40" height="40" rx="6" fill="#60a5fa" fill-opacity="0.25"/>
    <text x="44" y="235">1</text>
    <rect x="124" y="210" width="40" height="40" rx="6" fill="#60a5fa" fill-opacity="0.25"/>
    <text x="144" y="235">2</text>
    <rect x="224" y="210" width="40" height="40" rx="6" fill="#60a5fa" fill-opacity="0.25"/>
    <text x="244" y="235">3</text>
    <rect x="324" y="210" width="40" height="40" rx="6" fill="#60a5fa" fill-opacity="0.25"/>
    <text x="344" y="235">4</text>
  </g>
  <g stroke="#60a5fa" stroke-width="2">
    <line x1="68" y1="234" x2="120" y2="234" marker-end="url(#a)"/>
    <line x1="168" y1="234" x2="220" y2="234" marker-end="url(#a)"/>
    <line x1="268" y1="234" x2="320" y2="234" marker-end="url(#a)"/>
    <line x1="368" y1="234" x2="428" y2="234" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">
    <text x="94" y="224">+1 枚</text>
    <text x="194" y="224">+1 枚</text>
    <text x="294" y="224">+1 枚</text>
  </g>
  <rect x="432" y="168" width="264" height="122" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="448" y="192" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">1 秒続いたら投稿</text>
  <text x="448" y="220" fill="#ffffff" fill-opacity="0.6" font-size="12">・枚数がそろっている</text>
  <text x="448" y="244" fill="#ffffff" fill-opacity="0.6" font-size="12">・進捗バーが出ていない</text>
  <text x="448" y="268" fill="#ffffff" fill-opacity="0.6" font-size="12">・投稿ボタンが有効</text>
</svg>
