<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">曲の終わりで 2 曲の音量を入れ替える</text>

  <!-- 交差する区間 -->
  <rect x="250" y="70" width="220" height="170" rx="8" fill="#60a5fa" fill-opacity="0.08"/>
  <text x="360" y="268" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">交差(2〜8 秒)</text>

  <!-- 軸 -->
  <line x1="60" y1="240" x2="680" y2="240" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <text x="40" y="95" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">大</text>
  <text x="40" y="234" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">0</text>

  <!-- 前の曲 -->
  <path d="M60 90 L250.0 90.0 L261.0 90.4 L272.0 91.7 L283.0 93.9 L294.0 96.9 L305.0 100.7 L316.0 105.3 L327.0 110.6 L338.0 116.7 L349.0 123.5 L360.0 131.0 L371.0 139.1 L382.0 147.7 L393.0 156.9 L404.0 166.4 L415.0 176.4 L426.0 186.7 L437.0 197.3 L448.0 208.1 L459.0 219.0 L470.0 230.0" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="70" y="80" fill="#ffffff" fill-opacity="0.6" font-size="13">前の曲</text>

  <!-- 次の曲 -->
  <path d="M250.0 230.0 L261.0 219.0 L272.0 208.1 L283.0 197.3 L294.0 186.7 L305.0 176.4 L316.0 166.4 L327.0 156.9 L338.0 147.7 L349.0 139.1 L360.0 131.0 L371.0 123.5 L382.0 116.7 L393.0 110.6 L404.0 105.3 L415.0 100.7 L426.0 96.9 L437.0 93.9 L448.0 91.7 L459.0 90.4 L470.0 90.0 L680 90" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="610" y="80" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">次の曲</text>

  <!-- B 点 -->
  <line x1="470" y1="64" x2="470" y2="240" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="480" y="160" fill="#ffffff" fill-opacity="0.4" font-size="11">前の曲の B 点</text>
</svg>
