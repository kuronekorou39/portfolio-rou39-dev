<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, sans-serif">
  <rect width="720" height="290" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">ヘッダが宣言するサイズと、受信側の線引き</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">対数目盛</text>

  <!-- 帯 -->
  <text x="153" y="96" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">受け入れる</text>
  <rect x="60" y="108" width="187" height="30" rx="4" fill="#60a5fa" fill-opacity="0.55"/>
  <text x="453" y="96" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">捨てて受信を続ける</text>
  <rect x="249" y="108" width="411" height="30" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="534" y="108" width="126" height="30" rx="4" fill="#f87171" fill-opacity="0.4"/>

  <!-- 軸 -->
  <line x1="60" y1="150" x2="660" y2="150" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="2">
    <line x1="135" y1="144" x2="135" y2="158"/>
    <line x1="285" y1="144" x2="285" y2="158"/>
    <line x1="534" y1="144" x2="534" y2="158"/>
    <line x1="660" y1="144" x2="660" y2="158"/>
  </g>
  <line x1="248" y1="102" x2="248" y2="160" stroke="#60a5fa" stroke-width="2"/>

  <text x="135" y="180" fill="#ffffff" fill-opacity="0.45" font-size="12" text-anchor="middle">64MB(最初の案)</text>
  <text x="248" y="180" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">512MB</text>
  <text x="660" y="180" fill="#ffffff" fill-opacity="0.45" font-size="12" text-anchor="end">約 1TB = 40bit の上限</text>

  <text x="285" y="212" fill="#ffffff" fill-opacity="0.6" font-size="12">1GB: 確保に 139ms</text>
  <line x1="285" y1="160" x2="285" y2="198" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="660" y="212" fill="#f87171" font-size="12" font-weight="700" text-anchor="end">100GB 以上: 確保に失敗して panic</text>

  <text x="60" y="256" fill="#ffffff" fill-opacity="0.4" font-size="12">1 オブジェクトとして作れる大きさ: 既定の符号化で 512MB 付近まで(RaptorQ の天井は 578MB)</text>
</svg>
