<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">倍速をかける video の選び方</text>

  <!-- ページ -->
  <rect x="24" y="60" width="430" height="226" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">Prime Video のページ</text>

  <rect x="44" y="98" width="390" height="56" rx="8" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.5"/>
  <text x="60" y="131" fill="#f87171" font-size="13">予告編の video(DOM 順で先)</text>

  <rect x="44" y="168" width="390" height="102" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="60" y="192" fill="#ffffff" fill-opacity="0.6" font-size="12">本編のプレイヤー</text>
  <rect x="60" y="208" width="130" height="44" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <text x="125" y="235" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">広告タイマー</text>
  <line x1="194" y1="238" x2="284" y2="238" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="239" y="228" fill="#60a5fa" font-size="11" text-anchor="middle">祖先を辿る</text>
  <rect x="288" y="208" width="130" height="44" rx="8" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="353" y="235" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">本編の video</text>

  <!-- 右 -->
  <line x1="474" y1="126" x2="442" y2="126" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="482" y="108" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <text x="482" y="130" fill="#ffffff" fill-opacity="0.6" font-size="12">最初に見つかる video</text>
  <text x="482" y="152" fill="#f87171" font-size="12">予告編に倍速とミュート</text>

  <text x="482" y="212" fill="#60a5fa" font-size="12" font-weight="700">直した後</text>
  <text x="482" y="234" fill="#ffffff" fill-opacity="0.6" font-size="12">広告タイマーと同じ</text>
  <text x="482" y="256" fill="#ffffff" fill-opacity="0.6" font-size="12">プレイヤーの中の video</text>
</svg>
