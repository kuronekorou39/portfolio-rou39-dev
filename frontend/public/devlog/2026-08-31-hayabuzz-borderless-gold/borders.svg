<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" font-family="system-ui, sans-serif">
  <rect width="720" height="336" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">出題者画面の区切り方</text>

  <!-- 前: 枠線 9 本 -->
  <rect x="24" y="64" width="324" height="234" rx="10" fill="#ffffff" fill-opacity="0.04"/>
  <text x="40" y="90" fill="#f87171" font-size="12" font-weight="700">前: 枠線 9 本</text>
  <g fill="none" stroke="#f87171" stroke-opacity="0.7" stroke-width="1.5">
    <rect x="40" y="104" width="292" height="180" rx="8"/>
    <rect x="54" y="114" width="264" height="24" rx="6"/>
    <rect x="54" y="146" width="264" height="30" rx="6"/>
    <rect x="54" y="184" width="264" height="52" rx="8"/>
    <rect x="64" y="194" width="76" height="32" rx="6"/>
    <rect x="148" y="194" width="76" height="32" rx="6"/>
    <rect x="232" y="194" width="76" height="32" rx="6"/>
    <rect x="54" y="244" width="126" height="30" rx="6"/>
    <rect x="192" y="244" width="126" height="30" rx="6"/>
  </g>

  <!-- 後: 0 本 -->
  <rect x="372" y="64" width="324" height="234" rx="10" fill="#ffffff" fill-opacity="0.04"/>
  <text x="388" y="90" fill="#60a5fa" font-size="12" font-weight="700">後: 0 本(面の明度差と影)</text>
  <rect x="388" y="104" width="292" height="180" rx="8" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="402" y="114" width="264" height="24" rx="6" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="402" y="146" width="264" height="30" rx="6" fill="#000000" fill-opacity="0.45"/>
  <rect x="402" y="184" width="264" height="52" rx="8" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="412" y="194" width="76" height="32" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#60a5fa" stroke-width="2"/>
  <rect x="496" y="194" width="76" height="32" rx="6" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="580" y="194" width="76" height="32" rx="6" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="402" y="244" width="126" height="30" rx="6" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="540" y="244" width="126" height="30" rx="6" fill="#ffffff" fill-opacity="0.18"/>

  <line x1="450" y1="228" x2="450" y2="306" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="462" y="320" fill="#ffffff" fill-opacity="0.6" font-size="12">枠は「選択中」など状態だけ</text>
