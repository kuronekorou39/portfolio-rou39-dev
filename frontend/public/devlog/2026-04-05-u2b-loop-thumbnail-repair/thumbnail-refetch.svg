<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">インポート後にサムネイルを取り直す</text>

  <!-- インポート -->
  <rect x="24" y="104" width="170" height="84" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="109" y="140" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">インポート</text>
  <text x="109" y="164" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">サムネイルが無い</text>

  <line x1="202" y1="146" x2="240" y2="146" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 待ち時間の管理 -->
  <rect x="248" y="84" width="220" height="124" rx="10" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="358" y="114" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">待ち時間を 1 か所で管理</text>
  <text x="358" y="144" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">300ms から増やす</text>
  <text x="358" y="166" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">上限 3 秒</text>
  <text x="358" y="190" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">30 秒空けばリセット</text>

  <line x1="476" y1="130" x2="518" y2="106" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476" y1="162" x2="518" y2="186" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 取り直し方 -->
  <rect x="526" y="64" width="170" height="72" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="611" y="94" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">YouTube</text>
  <text x="611" y="118" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">URL から取得</text>
  <rect x="526" y="156" width="170" height="72" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="611" y="186" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">ローカル動画</text>
  <text x="611" y="210" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">フレーム抽出</text>
</svg>
