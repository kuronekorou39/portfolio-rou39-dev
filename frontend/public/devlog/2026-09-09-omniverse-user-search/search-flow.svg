<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">ユーザー検索から、表示制限の確認まで</text>

  <!-- アカウント一覧 -->
  <rect x="24" y="60" width="150" height="220" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">アカウント一覧</text>
  <circle cx="150" cy="81" r="10" fill="#60a5fa" fill-opacity="0.5"/>
  <path d="M146 77a4 4 0 1 0 0.1 0M152 84l4 4" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.5"/>
  <g fill="#ffffff" fill-opacity="0.1">
    <rect x="40" y="104" width="118" height="30" rx="6"/>
    <rect x="40" y="142" width="118" height="30" rx="6"/>
    <rect x="40" y="180" width="118" height="30" rx="6"/>
  </g>
  <line x1="174" y1="130" x2="228" y2="130" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>

  <!-- 検索 -->
  <rect x="230" y="60" width="240" height="220" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="246" y="86" fill="#60a5fa" font-size="12" font-weight="700">ユーザー検索</text>
  <rect x="246" y="100" width="60" height="22" rx="11" fill="#60a5fa" fill-opacity="0.35"/>
  <rect x="312" y="100" width="60" height="22" rx="11" fill="#ffffff" fill-opacity="0.1"/>
  <text x="382" y="116" fill="#ffffff" fill-opacity="0.4" font-size="11">で探す</text>
  <rect x="246" y="134" width="208" height="32" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="258" y="155" fill="#ffffff" fill-opacity="0.4" font-size="11">@ID / URL も受ける</text>
  <g fill="#ffffff">
    <circle cx="260" cy="200" r="11" fill-opacity="0.18"/>
    <rect x="280" y="190" width="90" height="7" rx="3" fill-opacity="0.3"/>
    <rect x="280" y="204" width="150" height="7" rx="3" fill-opacity="0.14"/>
    <circle cx="260" cy="244" r="11" fill-opacity="0.18"/>
    <rect x="280" y="234" width="70" height="7" rx="3" fill-opacity="0.3"/>
    <rect x="280" y="248" width="130" height="7" rx="3" fill-opacity="0.14"/>
  </g>
  <line x1="470" y1="130" x2="514" y2="130" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>

  <!-- プロフィール -->
  <rect x="516" y="60" width="180" height="90" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="532" y="88" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">プロフィール</text>
  <rect x="532" y="102" width="120" height="7" rx="3" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="532" y="118" width="148" height="7" rx="3" fill="#ffffff" fill-opacity="0.12"/>
  <line x1="606" y1="150" x2="606" y2="178" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>

  <!-- 表示制限の確認 -->
  <rect x="516" y="180" width="180" height="100" rx="10" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="532" y="208" fill="#60a5fa" font-size="13" font-weight="700">表示制限の確認</text>
  <text x="532" y="234" fill="#ffffff" fill-opacity="0.6" font-size="11">「判定不能」は分けて出す</text>
  <text x="532" y="256" fill="#ffffff" fill-opacity="0.6" font-size="11">本人が見ていれば警告</text>
</svg>
