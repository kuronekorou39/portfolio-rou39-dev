<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">「端末内」モードの解析の流れ</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">Gemma 4 E2B</text>

  <g font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff" fill-opacity="0.85">
    <rect x="24" y="72" width="132" height="64" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="90" y="109">未解析の写真</text>

    <rect x="204" y="72" width="132" height="64" rx="10" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="270" y="109">ロード(1 回)</text>

    <rect x="384" y="72" width="132" height="64" rx="10" fill="#60a5fa" fill-opacity="0.25"/>
    <text x="450" y="109">全件を解析</text>

    <rect x="564" y="72" width="132" height="64" rx="10" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="630" y="109">解放</text>
  </g>
  <line x1="160" y1="104" x2="196" y2="104" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="104" x2="376" y2="104" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="104" x2="556" y2="104" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="158" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">メモリを節約</text>

  <line x1="450" y1="140" x2="450" y2="188" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="196" width="220" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="450" y="229" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">結果 <tspan fill="#60a5fa" font-weight="700">＋ モデル名</tspan> を保存</text>
  <line x1="564" y1="224" x2="588" y2="224" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="229" fill="#ffffff" fill-opacity="0.6" font-size="13">詳細画面に表示</text>
</svg>
