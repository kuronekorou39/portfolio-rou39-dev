<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">所要時間の目安を、何から出すか</text>

  <!-- 直す前 -->
  <text x="24" y="78" fill="#f87171" font-size="12" font-weight="700">直す前: 過去の取得の実測</text>
  <rect x="24" y="90" width="200" height="56" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="124" y="114" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">3000 件 ÷ 3 日</text>
  <text x="124" y="133" fill="#f87171" font-size="11" text-anchor="middle">放置した時間も入る</text>
  <line x1="224" y1="118" x2="268" y2="118" stroke="#f87171" stroke-width="2" marker-end="url(#r)"/>
  <rect x="270" y="90" width="170" height="56" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="355" y="123" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">毎分 0.7 件</text>
  <line x1="440" y1="118" x2="484" y2="118" stroke="#f87171" stroke-width="2" marker-end="url(#r)"/>
  <rect x="486" y="90" width="210" height="56" rx="8" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="591" y="123" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">残り約 600 日</text>

  <!-- 採用 -->
  <text x="24" y="198" fill="#60a5fa" font-size="12" font-weight="700">採用: 理論値だけ</text>
  <rect x="24" y="210" width="200" height="56" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="124" y="234" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">1 ページ 50 件</text>
  <text x="124" y="254" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">送信間隔 2 秒</text>
  <line x1="224" y1="238" x2="268" y2="238" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
  <rect x="270" y="210" width="170" height="56" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="355" y="243" fill="#ffffff" fill-opacity="0.9" font-size="14" font-weight="700" text-anchor="middle">毎分 1500 件</text>
  <line x1="440" y1="238" x2="484" y2="238" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
  <rect x="486" y="210" width="210" height="56" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="591" y="234" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">目安は下限として読む</text>
  <text x="591" y="254" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">レート制限の待機で遅くなる</text>
</svg>
