<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">Android: ポップアップの WebView が名乗る User-Agent</text>

  <!-- 直す前 -->
  <text x="24" y="74" fill="#f87171" font-size="12" font-weight="700">直す前(設定を丸ごと消した状態)</text>
  <rect x="24" y="86" width="150" height="64" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="113" fill="#ffffff" fill-opacity="0.85" font-size="13">親の WebView</text>
  <text x="40" y="134" fill="#ffffff" fill-opacity="0.6" font-size="12">UA: Chrome</text>
  <line x1="178" y1="118" x2="212" y2="118" stroke="#f87171" stroke-width="2" marker-end="url(#arrowr)"/>
  <rect x="220" y="86" width="260" height="64" rx="8" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.7"/>
  <text x="236" y="113" fill="#ffffff" fill-opacity="0.85" font-size="13">ポップアップの WebView</text>
  <text x="236" y="134" fill="#f87171" font-size="12">UA: 埋め込み WebView に戻る</text>
  <line x1="484" y1="118" x2="518" y2="118" stroke="#f87171" stroke-width="2" marker-end="url(#arrowr)"/>
  <rect x="526" y="86" width="170" height="64" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="542" y="113" fill="#ffffff" fill-opacity="0.85" font-size="13">Google</text>
  <text x="542" y="134" fill="#f87171" font-size="11">403 disallowed_useragent</text>

  <!-- 直した後 -->
  <text x="24" y="196" fill="#60a5fa" font-size="12" font-weight="700">直した後(Android のときだけ設定を渡す)</text>
  <rect x="24" y="208" width="150" height="64" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="235" fill="#ffffff" fill-opacity="0.85" font-size="13">親の WebView</text>
  <text x="40" y="256" fill="#ffffff" fill-opacity="0.6" font-size="12">UA: Chrome</text>
  <line x1="178" y1="240" x2="212" y2="240" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="208" width="260" height="64" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="236" y="235" fill="#ffffff" fill-opacity="0.85" font-size="13">ポップアップの WebView</text>
  <text x="236" y="256" fill="#60a5fa" font-size="12" font-weight="700">UA: Chrome</text>
  <line x1="484" y1="240" x2="518" y2="240" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="526" y="208" width="170" height="64" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="542" y="235" fill="#ffffff" fill-opacity="0.85" font-size="13">Google</text>
  <text x="542" y="256" fill="#ffffff" fill-opacity="0.6" font-size="12">弾かれない</text>
</svg>
