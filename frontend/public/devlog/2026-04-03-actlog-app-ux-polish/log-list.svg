<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">ログ一覧: 日付でまとめ、スワイプで削除</text>

  <!-- 画面 -->
  <rect x="24" y="60" width="330" height="246" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="88" fill="#60a5fa" font-size="12" font-weight="700">今日</text>
  <rect x="40" y="98" width="298" height="36" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="54" y="121" fill="#ffffff" fill-opacity="0.5" font-size="12">ログ</text>
  <text x="40" y="160" fill="#60a5fa" font-size="12" font-weight="700">昨日</text>
  <rect x="258" y="170" width="80" height="36" rx="8" fill="#f87171" fill-opacity="0.25"/>
  <text x="298" y="193" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">削除</text>
  <rect x="40" y="170" width="212" height="36" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="54" y="193" fill="#ffffff" fill-opacity="0.5" font-size="12">ログ</text>
  <text x="40" y="232" fill="#60a5fa" font-size="12" font-weight="700">今週</text>
  <rect x="40" y="254" width="298" height="38" rx="8" fill="#ffffff" fill-opacity="0.1"/>
  <text x="54" y="278" fill="#ffffff" fill-opacity="0.7" font-size="12">削除しました</text>
  <text x="324" y="278" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="end">元に戻す</text>

  <!-- 注記 -->
  <line x1="386" y1="84" x2="362" y2="84" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396" y="88" fill="#ffffff" fill-opacity="0.85" font-size="13">日付ごとのグループ</text>
  <text x="396" y="110" fill="#ffffff" fill-opacity="0.4" font-size="12">今日 / 昨日 / 今週 / 今月 / 年月</text>

  <line x1="386" y1="188" x2="362" y2="188" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396" y="192" fill="#ffffff" fill-opacity="0.85" font-size="13">右から左へスワイプで削除</text>

  <line x1="386" y1="273" x2="362" y2="273" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396" y="277" fill="#ffffff" fill-opacity="0.85" font-size="13">直後なら取り消せる</text>
</svg>
