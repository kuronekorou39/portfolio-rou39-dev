  <text x="40" y="228" fill="#ffffff" fill-opacity="0.4" font-size="12">LCD の残像とローリングシャッターで</text>
  <text x="40" y="248" fill="#ffffff" fill-opacity="0.4" font-size="12">前後のフレームが混ざる</text>

  <rect x="372" y="60" width="324" height="216" rx="10" fill="#60a5fa" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="388" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">1bit / セル(白黒)= 新しいプリセット</text>
