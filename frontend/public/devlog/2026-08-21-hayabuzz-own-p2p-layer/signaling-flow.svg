<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.5"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">自前の P2P 層: シグナリングから直結まで</text>

  <!-- 回答者 -->
  <rect x="24" y="64" width="160" height="82" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="104" y="100" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">回答者</text>
  <text x="104" y="124" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">peer_id に役割</text>

  <!-- トラッカー -->
  <rect x="260" y="64" width="200" height="82" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="360" y="90" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">WebTorrent トラッカー</text>
  <text x="360" y="112" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">複数に並行 / 重複は捨てる</text>
  <text x="360" y="132" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">announce に相乗り</text>

  <!-- 出題者 -->
  <rect x="536" y="64" width="160" height="82" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="616" y="100" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">出題者</text>
  <text x="616" y="124" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">peer_id に役割</text>

  <!-- offer / answer -->
  <line x1="188" y1="92" x2="256" y2="92" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="464" y1="92" x2="532" y2="92" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="532" y1="120" x2="464" y2="120" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="256" y1="120" x2="188" y2="120" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="222" y="82" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">offer</text>
  <text x="498" y="82" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">offer</text>
  <text x="222" y="138" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">answer</text>
  <text x="498" y="138" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">answer</text>

  <!-- 直結 -->
  <path d="M104 146 V214 H616 V146" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="360" y="200" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">RTCPeerConnection / DataChannel で直結</text>
  <text x="360" y="244" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">回答者どうしはつながない(スター型)</text>
</svg>
