<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">保留が溜まったら「高速で流す」</text>

  <!-- タイムライン -->
  <rect x="24" y="56" width="250" height="224" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="74" y="68" width="150" height="30" rx="15" fill="#60a5fa" fill-opacity="0.3" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="149" y="88" fill="#ffffff" fill-opacity="0.85" font-size="12" font-weight="700" text-anchor="middle">高速で流す</text>
  <rect x="40" y="110" width="218" height="46" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="56" y="138" fill="#60a5fa" font-size="12">新着が上から入る</text>
  <rect x="40" y="166" width="218" height="46" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="40" y="222" width="218" height="46" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="56" y="184" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="56" y="240" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>

  <!-- 条件 -->
  <line x1="300" y1="83" x2="232" y2="83" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="88" fill="#ffffff" fill-opacity="0.6" font-size="12">保留が 100 件以上のときに出る</text>

  <!-- 速さ -->
  <text x="310" y="140" fill="#ffffff" fill-opacity="0.4" font-size="11">流す速さ(件/秒)</text>
  <g font-size="13">
    <text x="310" y="180" fill="#ffffff" fill-opacity="0.6">通常(最速)</text>
    <rect x="420" y="162" width="44" height="26" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <text x="474" y="180" fill="#ffffff" fill-opacity="0.7">1</text>
    <text x="310" y="226" fill="#ffffff" fill-opacity="0.6">高速ドリップ</text>
    <rect x="420" y="208" width="220" height="26" rx="4" fill="#60a5fa"/>
    <text x="650" y="226" fill="#ffffff" font-weight="700">5</text>
  </g>
  <text x="310" y="268" fill="#ffffff" fill-opacity="0.4" font-size="11">キューが空になれば自動で解除</text>
</svg>
