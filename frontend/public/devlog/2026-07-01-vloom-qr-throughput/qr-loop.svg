<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">QR の動画ループ (1x1) で直した 2 箇所</text>

  <g text-anchor="middle">
    <rect x="24" y="64" width="120" height="76" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="84" y="96" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">ファイル</text>
    <text x="84" y="120" fill="#ffffff" fill-opacity="0.5" font-size="12">215KB</text>

    <rect x="162" y="64" width="120" height="76" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="222" y="96" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">パケット</text>
    <text x="222" y="120" fill="#60a5fa" font-size="12" font-weight="700">上限 540B</text>

    <rect x="300" y="64" width="120" height="76" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="360" y="96" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">QR v18 / M</text>
    <text x="360" y="120" fill="#ffffff" fill-opacity="0.5" font-size="12">容量 564B</text>

    <rect x="438" y="64" width="120" height="76" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="498" y="96" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">カメラ</text>
    <text x="498" y="120" fill="#60a5fa" font-size="12" font-weight="700">640px → 実寸</text>

    <rect x="576" y="64" width="120" height="76" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="636" y="96" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">復元</text>
    <text x="636" y="120" fill="#ffffff" fill-opacity="0.5" font-size="12">4.3 KB/s</text>
  </g>
  <g stroke="#60a5fa" stroke-width="2">
    <line x1="146" y1="102" x2="158" y2="102" marker-end="url(#arrow)"/>
    <line x1="284" y1="102" x2="296" y2="102" marker-end="url(#arrow)"/>
    <line x1="422" y1="102" x2="434" y2="102" marker-end="url(#arrow)"/>
    <line x1="560" y1="102" x2="572" y2="102" marker-end="url(#arrow)"/>
  </g>

  <!-- 要件との比較 -->
  <text x="24" y="186" fill="#ffffff" fill-opacity="0.45" font-size="12">200KB 級の受信にかかった時間</text>
  <g font-size="13">
    <text x="24" y="223" fill="#ffffff" fill-opacity="0.6">要件</text>
    <rect x="90" y="206" width="480" height="26" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <text x="580" y="224" fill="#ffffff" fill-opacity="0.7">60 秒</text>
    <text x="24" y="265" fill="#ffffff" fill-opacity="0.6">実測</text>
    <rect x="90" y="248" width="393" height="26" rx="4" fill="#60a5fa"/>
    <text x="493" y="266" fill="#ffffff" font-weight="700">49.1 秒</text>
  </g>
</svg>
