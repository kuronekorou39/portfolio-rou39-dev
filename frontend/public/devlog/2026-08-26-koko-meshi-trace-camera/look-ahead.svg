<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">再生中の地図のカメラの動かし方</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">枠がカメラに映る範囲</text>

  <!-- 前 -->
  <rect x="24" y="60" width="324" height="220" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">v0.10.2 まで</text>
  <text x="40" y="108" fill="#f87171" font-size="12" font-weight="700">90ms ごとに現在地へ瞬間移動</text>
  <path d="M50 236 L110 196 L170 206 L230 156 L310 130" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="106" y="178" width="76" height="52" rx="4" fill="none" stroke="#f87171" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="120" y="180" width="76" height="52" rx="4" fill="none" stroke="#f87171" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="134" y="176" width="76" height="52" rx="4" fill="none" stroke="#f87171" stroke-width="2"/>
  <circle cx="172" cy="204" r="6" fill="#ffffff" fill-opacity="0.85"/>
  <text x="332" y="264" fill="#f87171" font-size="12" text-anchor="end">地図がカクつく</text>

  <!-- 後 -->
  <rect x="372" y="60" width="324" height="220" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="388" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">v0.10.4</text>
  <text x="388" y="108" fill="#60a5fa" font-size="12" font-weight="700">これから通る範囲まで入れて引く</text>
  <path d="M398 236 L458 196 L518 206" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M518 206 L578 156 L618 143" fill="none" stroke="#60a5fa" stroke-width="4"/>
  <path d="M618 143 L658 130" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="494" y="124" width="148" height="104" rx="4" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="518" cy="206" r="6" fill="#ffffff" fill-opacity="0.85"/>
  <text x="680" y="248" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="end">青線 = 再生時間の 6% 先まで</text>
  <text x="680" y="268" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="end">収まっている間は動かさない</text>
</svg>
