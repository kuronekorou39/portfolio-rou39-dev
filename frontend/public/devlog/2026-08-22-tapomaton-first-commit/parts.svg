<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.4"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">見る・判断する・操作するの分担</text>

  <!-- 画面 -->
  <rect x="24" y="96" width="140" height="180" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="94" y="182" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">対象アプリ</text>
  <text x="94" y="204" fill="#ffffff" fill-opacity="0.5" font-size="12" text-anchor="middle">の画面</text>

  <line x1="168" y1="146" x2="208" y2="146" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrowDim)"/>
  <text x="188" y="136" fill="#ffffff" fill-opacity="0.5" font-size="12" text-anchor="middle">見る</text>
  <line x1="212" y1="232" x2="172" y2="232" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="254" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">操作</text>

  <!-- サービス -->
  <rect x="216" y="64" width="212" height="244" rx="10" fill="#60a5fa" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="232" y="92" fill="#60a5fa" font-size="13" font-weight="700">AccessibilityService</text>
  <text x="232" y="112" fill="#ffffff" fill-opacity="0.45" font-size="12">端末との出入口をここに集約</text>
  <g font-size="12" fill="#ffffff" fill-opacity="0.8">
    <rect x="232" y="126" width="180" height="40" rx="6" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="246" y="151">画面の取得</text>
    <rect x="232" y="174" width="180" height="40" rx="6" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="246" y="199">ノードツリーの取得</text>
    <rect x="232" y="222" width="180" height="40" rx="6" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="246" y="247">タップ・スワイプの注入</text>
  </g>

  <line x1="432" y1="130" x2="468" y2="130" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrowDim)"/>
  <line x1="472" y1="160" x2="436" y2="160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- エンジン -->
  <rect x="476" y="64" width="220" height="130" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="492" y="92" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">シナリオエンジン</text>
  <text x="492" y="118" fill="#ffffff" fill-opacity="0.6" font-size="12">判断はルールが主</text>
  <text x="492" y="142" fill="#ffffff" fill-opacity="0.6" font-size="12">押してはいけない語を判定</text>
  <text x="492" y="166" fill="#ffffff" fill-opacity="0.6" font-size="12">同じ画面なら停止 / 最大 15 分</text>

  <line x1="586" y1="198" x2="586" y2="226" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrowDim)"/>
  <text x="598" y="217" fill="#ffffff" fill-opacity="0.5" font-size="12">読めない画面だけ</text>

  <rect x="476" y="232" width="220" height="76" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="492" y="262" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">端末内 LLM</text>
  <text x="492" y="286" fill="#ffffff" fill-opacity="0.6" font-size="12">「何がどの隅に見えるか」だけ</text>
</svg>
