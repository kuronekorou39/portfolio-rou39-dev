<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">別々の ID で届く通知を「同じ出来事」で束ねる</text>

  <g fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="24" y="64" width="200" height="56" rx="8"/>
    <rect x="24" y="132" width="200" height="56" rx="8"/>
    <rect x="24" y="200" width="200" height="56" rx="8"/>
  </g>
  <g font-size="13" fill="#ffffff" fill-opacity="0.85">
    <text x="40" y="88">REST の通知</text>
    <text x="40" y="156">GraphQL の通知</text>
    <text x="40" y="224">人数が変わった再通知</text>
  </g>
  <g font-size="11" fill="#f87171">
    <text x="40" y="108">ID その 1</text>
    <text x="40" y="176">ID その 2</text>
    <text x="40" y="244">ID その 3</text>
  </g>
  <g stroke="#60a5fa" stroke-width="2">
    <line x1="228" y1="92" x2="282" y2="140" marker-end="url(#arrow)"/>
    <line x1="228" y1="160" x2="282" y2="160" marker-end="url(#arrow)"/>
    <line x1="228" y1="228" x2="282" y2="180" marker-end="url(#arrow)"/>
  </g>

  <rect x="290" y="106" width="200" height="108" rx="10" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="390" y="140" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">同じ出来事のキー</text>
  <text x="390" y="168" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">種類 + 対象の投稿 ID</text>
  <text x="390" y="194" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">重なれば REST を優先</text>

  <line x1="494" y1="160" x2="538" y2="160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="546" y="106" width="150" height="108" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="621" y="140" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">通知 1 件</text>
  <text x="621" y="168" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">新しい内容で上書き</text>
  <text x="621" y="190" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">時刻順で先頭へ</text>
</svg>
