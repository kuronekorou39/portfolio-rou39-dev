<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.5"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">部屋を作ってから出題できるまで</text>

  <!-- 前 -->
  <text x="24" y="101" fill="#f87171" font-size="12" font-weight="700">前</text>
  <g font-size="13" text-anchor="middle">
    <rect x="64" y="72" width="150" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="139" y="101" fill="#ffffff" fill-opacity="0.6">部屋を作る</text>
    <rect x="280" y="72" width="170" height="48" rx="8" fill="#0b0c10" stroke="#f87171" stroke-opacity="0.6"/>
    <text x="365" y="101" fill="#f87171" font-weight="700">ロビー画面</text>
    <rect x="516" y="72" width="180" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="606" y="101" fill="#ffffff" fill-opacity="0.6">進行画面</text>
  </g>
  <line x1="220" y1="96" x2="272" y2="96" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrow-dim)"/>
  <line x1="456" y1="96" x2="508" y2="96" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrow-dim)"/>

  <!-- 後 -->
  <text x="24" y="215" fill="#60a5fa" font-size="12" font-weight="700">後</text>
  <rect x="64" y="186" width="150" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="139" y="215" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">部屋を作る</text>
  <line x1="220" y1="210" x2="272" y2="210" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="150" width="416" height="120" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="296" y="174" fill="#ffffff" fill-opacity="0.45" font-size="12">進行画面(問題入力)</text>
  <rect x="296" y="186" width="384" height="40" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="488" y="211" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">共有ポップアップ(コード・URL・QR)</text>
  <text x="296" y="252" fill="#ffffff" fill-opacity="0.4" font-size="11">閉じればそのまま出題できる</text>
</svg>
