<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="270" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">PiP への入り方を API レベルで分ける</text>

  <!-- きっかけ -->
  <rect x="24" y="112" width="150" height="76" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="99" y="144" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">アプリを離れる</text>
  <text x="99" y="168" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">ホーム / タスク一覧</text>

  <line x1="182" y1="136" x2="218" y2="108" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="182" y1="164" x2="218" y2="192" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 分岐 -->
  <rect x="226" y="64" width="280" height="72" rx="10" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="242" y="92" fill="#60a5fa" font-size="13" font-weight="700">API 31 以上: 自動に委任</text>
  <text x="242" y="116" fill="#ffffff" fill-opacity="0.6" font-size="12">setAutoEnterEnabled</text>
  <rect x="226" y="164" width="280" height="72" rx="10" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="242" y="192" fill="#60a5fa" font-size="13" font-weight="700">API 26〜30: 手動で入る</text>
  <text x="242" y="216" fill="#ffffff" fill-opacity="0.6" font-size="12">onUserLeaveHint / onPause</text>

  <line x1="514" y1="108" x2="550" y2="136" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="514" y1="192" x2="550" y2="164" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PiP -->
  <rect x="558" y="112" width="138" height="76" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="627" y="144" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">PiP</text>
  <text x="627" y="168" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">直後に状態を再同期</text>
</svg>
