<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.4"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">iOS 版で足した部分</text>

  <!-- Flutter -->
  <rect x="24" y="64" width="672" height="52" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="360" y="95" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">Flutter(画面とロジックは共通)</text>

  <line x1="184" y1="122" x2="184" y2="150" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="536" y1="122" x2="536" y2="150" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="142" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">波形抽出のチャネル</text>

  <!-- Android -->
  <rect x="24" y="158" width="320" height="84" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="186" fill="#ffffff" fill-opacity="0.45" font-size="12">Android</text>
  <text x="40" y="216" fill="#ffffff" fill-opacity="0.6" font-size="13">既存のネイティブ実装</text>

  <!-- iOS -->
  <rect x="376" y="158" width="320" height="84" rx="10" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="392" y="186" fill="#60a5fa" font-size="12" font-weight="700">iOS(今回)</text>
  <text x="392" y="216" fill="#ffffff" fill-opacity="0.85" font-size="13">AVAssetReader で波形抽出</text>

  <!-- CI -->
  <rect x="376" y="266" width="90" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="421" y="291" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">CI</text>
  <line x1="472" y1="286" x2="490" y2="286" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="496" y="266" width="200" height="40" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="596" y="291" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">IPA をリリースに添付</text>
  <text x="24" y="291" fill="#ffffff" fill-opacity="0.4" font-size="11">iOS の PiP は調査の途中</text>
</svg>
