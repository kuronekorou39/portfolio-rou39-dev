<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">三点メニューから、画面ごと小窓にする</text>

  <!-- ブラウザ -->
  <rect x="60" y="60" width="200" height="256" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="72" y="72" width="176" height="28" rx="6" fill="#ffffff" fill-opacity="0.08"/>
  <g fill="#ffffff" fill-opacity="0.6">
    <circle cx="236" cy="79" r="2"/><circle cx="236" cy="86" r="2"/><circle cx="236" cy="93" r="2"/>
  </g>
  <text x="84" y="91" fill="#ffffff" fill-opacity="0.4" font-size="11">アドレスバー</text>
  <text x="160" y="290"fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="middle">ページ</text>
  <!-- メニュー -->
  <rect x="128" y="104" width="124" height="150" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <rect x="134" y="110" width="112" height="32" rx="6" fill="#60a5fa" fill-opacity="0.25"/>
  <text x="146" y="131" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">小窓表示</text>
  <g fill="#ffffff" fill-opacity="0.12">
    <rect x="146" y="158" width="84" height="8" rx="4"/>
    <rect x="146" y="186" width="64" height="8" rx="4"/>
    <rect x="146" y="214" width="76" height="8" rx="4"/>
    <rect x="146" y="238" width="56" height="8" rx="4"/>
  </g>

  <line x1="276" y1="188" x2="344" y2="188" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ホーム画面 -->
  <rect x="360" y="60" width="200" height="256" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="376" y="88" fill="#ffffff" fill-opacity="0.4" font-size="12">ほかのアプリ</text>
  <rect x="408" y="216" width="144" height="81" rx="8" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa"/>
  <text x="480" y="261" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">BEX の画面</text>

  <!-- 条件 -->
  <text x="584" y="130" fill="#ffffff" fill-opacity="0.45" font-size="12">上流の小窓</text>
  <text x="584" y="152" fill="#ffffff" fill-opacity="0.6" font-size="12">全画面の動画が</text>
  <text x="584" y="170" fill="#ffffff" fill-opacity="0.6" font-size="12">1 つのときだけ</text>
  <text x="584" y="226" fill="#60a5fa" font-size="12" font-weight="700">今回のメニュー</text>
  <text x="584" y="248" fill="#ffffff" fill-opacity="0.85" font-size="12">動画が無くても</text>
  <text x="584" y="266" fill="#ffffff" fill-opacity="0.85" font-size="12">小窓にできる</text>
</svg>
