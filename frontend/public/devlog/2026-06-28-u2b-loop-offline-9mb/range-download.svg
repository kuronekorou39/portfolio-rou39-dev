<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="system-ui, sans-serif">
  <rect width="720" height="270" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">高解像度のダウンロードが進む量</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">映像と音声が別のストリーム</text>

  <text x="24" y="82" fill="#f87171" font-size="12" font-weight="700">直す前: ライブラリの分割処理</text>
  <rect x="24" y="94" width="672" height="32" rx="6" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="24" y="94" width="84" height="32" rx="6" fill="#f87171" fill-opacity="0.55"/>
  <text x="120" y="115" fill="#f87171" font-size="13" font-weight="700">約 9MB で 403 になり停止</text>

  <text x="24" y="172" fill="#60a5fa" font-size="12" font-weight="700">直した後: Range ヘッダで自前の分割</text>
  <g fill="#60a5fa" fill-opacity="0.6">
    <rect x="24" y="184" width="78" height="32" rx="6"/>
    <rect x="108" y="184" width="78" height="32" rx="6"/>
    <rect x="192" y="184" width="78" height="32" rx="6"/>
    <rect x="276" y="184" width="78" height="32" rx="6"/>
    <rect x="360" y="184" width="78" height="32" rx="6"/>
    <rect x="444" y="184" width="78" height="32" rx="6"/>
    <rect x="528" y="184" width="78" height="32" rx="6"/>
    <rect x="612" y="184" width="84" height="32" rx="6"/>
  </g>
  <text x="24" y="242" fill="#ffffff" fill-opacity="0.5" font-size="12">区切って順に取得</text>
  <text x="696" y="242" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="end">最後まで保存できる</text>
</svg>
