<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">ほぼ同時押しを E2E で再現する</text>

  <!-- 出題者 -->
  <rect x="24" y="114" width="150" height="100" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="99" y="146" fill="#ffffff" fill-opacity="0.45" font-size="12" text-anchor="middle">出題者</text>
  <text x="99" y="180" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700" text-anchor="middle">受付開始</text>

  <line x1="184" y1="164" x2="236" y2="164" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 回答者 3 端末 -->
  <rect x="246" y="64" width="250" height="212" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="262" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">回答者 3 端末</text>
  <g font-size="12">
    <rect x="262" y="104" width="218" height="40" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="276" y="129" fill="#ffffff" fill-opacity="0.6">端末 1</text>
    <text x="466" y="129" fill="#60a5fa" font-weight="700" text-anchor="end">受信 → 即押下</text>
    <rect x="262" y="152" width="218" height="40" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="276" y="177" fill="#ffffff" fill-opacity="0.6">端末 2</text>
    <text x="466" y="177" fill="#60a5fa" font-weight="700" text-anchor="end">受信 → 即押下</text>
    <rect x="262" y="200" width="218" height="40" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="276" y="225" fill="#ffffff" fill-opacity="0.6">端末 3</text>
    <text x="466" y="225" fill="#60a5fa" font-weight="700" text-anchor="end">受信 → 即押下</text>
  </g>
  <text x="262" y="262" fill="#ffffff" fill-opacity="0.4" font-size="11">各端末にオブザーバを仕込む</text>

  <line x1="506" y1="164" x2="558" y2="164" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 検証 -->
  <rect x="568" y="114" width="128" height="100" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="632" y="146" fill="#ffffff" fill-opacity="0.45" font-size="12" text-anchor="middle">検証</text>
  <text x="632" y="174" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">押下順</text>
  <text x="632" y="198" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">ms 差</text>
</svg>
