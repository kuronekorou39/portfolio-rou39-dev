<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">AB 区間をファイルに書き出す流れ</text>

  <!-- 元の動画 -->
  <rect x="24" y="64" width="250" height="180" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">エディタ画面の動画</text>
  <text x="104" y="136" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">A</text>
  <text x="194" y="136" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">B</text>
  <rect x="40" y="146" width="218" height="16" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="104" y="146" width="90" height="16" rx="4" fill="#60a5fa"/>
  <line x1="104" y1="140" x2="104" y2="168" stroke="#60a5fa" stroke-width="2"/>
  <line x1="194" y1="140" x2="194" y2="168" stroke="#60a5fa" stroke-width="2"/>
  <text x="149" y="196" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">ループ中の区間だけ切り出す</text>

  <!-- 切り出し -->
  <line x1="284" y1="154" x2="426" y2="154" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="355" y="140" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">MediaMuxer</text>
  <text x="355" y="176" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">キーフレーム単位</text>
  <text x="355" y="192" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">再エンコードなし</text>

  <!-- 出力 -->
  <rect x="436" y="64" width="260" height="180" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="452" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">書き出すファイル</text>
  <rect x="452" y="104" width="228" height="56" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
  <text x="470" y="138" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700">MP4</text>
  <text x="664" y="138" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="end">動画</text>
  <rect x="452" y="172" width="228" height="56" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
  <text x="470" y="206" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700">M4A</text>
  <text x="664" y="206" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="end">音声</text>
</svg>
