<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">リリクスモード: 動画の上に全行を重ねる</text>

  <!-- 動画 + 歌詞 -->
  <rect x="24" y="60" width="380" height="236" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">動画(半透明の黒を重ねる)</text>
  <g text-anchor="middle">
    <text x="214" y="122" fill="#ffffff" fill-opacity="0.25" font-size="13">過ぎた行</text>
    <text x="214" y="152" fill="#ffffff" fill-opacity="0.25" font-size="13">過ぎた行</text>
    <rect x="60" y="166" width="308" height="40" rx="8" fill="#60a5fa" fill-opacity="0.15"/>
    <text x="214" y="193" fill="#60a5fa" font-size="18" font-weight="700">いま再生中の行</text>
    <text x="214" y="236" fill="#ffffff" fill-opacity="0.55" font-size="13">これからの行</text>
    <text x="214" y="266" fill="#ffffff" fill-opacity="0.55" font-size="13">これからの行</text>
  </g>

  <!-- 右: 操作 -->
  <text x="436" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">字幕ボタンの 3 状態</text>
  <g font-size="13" text-anchor="middle">
    <rect x="436" y="98" width="60" height="36" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="466" y="121" fill="#ffffff" fill-opacity="0.6">OFF</text>
    <line x1="500" y1="116" x2="522" y2="116" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="526" y="98" width="74" height="36" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="563" y="121" fill="#ffffff" fill-opacity="0.6">カラオケ</text>
    <line x1="604" y1="116" x2="626" y2="116" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="630" y="98" width="66" height="36" rx="8" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="663" y="121" fill="#60a5fa" font-weight="700">リリクス</text>
  </g>

  <line x1="432" y1="186" x2="376" y2="186" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="444" y="182" fill="#ffffff" fill-opacity="0.7" font-size="13">再生位置へ自動スクロール</text>
  <text x="444" y="204" fill="#ffffff" fill-opacity="0.4" font-size="12">400ms のアニメーション</text>

  <line x1="432" y1="250" x2="376" y2="250" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="444" y="246" fill="#ffffff" fill-opacity="0.7" font-size="13">行をタップ</text>
  <text x="444" y="268" fill="#ffffff" fill-opacity="0.4" font-size="12">その位置へシーク</text>
</svg>
