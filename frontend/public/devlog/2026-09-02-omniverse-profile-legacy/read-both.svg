<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.45"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">X のユーザー情報を、どこから読むか</text>

  <rect x="24" y="60" width="330" height="224" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="84" fill="#ffffff" fill-opacity="0.45" font-size="12">X のユーザー応答</text>

  <rect x="40" y="98" width="298" height="66" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="56" y="124" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">legacy</text>
  <text x="56" y="147" fill="#f87171" font-size="12">移し終えたアカウントでは空</text>

  <rect x="40" y="180" width="298" height="88" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="56" y="206" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">新しい入れ物</text>
  <text x="56" y="229" fill="#ffffff" fill-opacity="0.6" font-size="12">core / avatar / banner / profile_bio</text>
  <text x="56" y="251" fill="#ffffff" fill-opacity="0.6" font-size="12">自己紹介とヘッダ画像はこちらへ</text>

  <line x1="338" y1="131" x2="498" y2="160" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" marker-end="url(#g)"/>
  <text x="372" y="122" fill="#f87171" font-size="11" font-weight="700">直す前はここだけ</text>
  <line x1="338" y1="224" x2="498" y2="188" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
  <text x="372" y="242" fill="#60a5fa" font-size="11" font-weight="700">今回: こちらも読む</text>

  <rect x="500" y="132" width="196" height="84" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="516" y="162" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">プロフィール画面</text>
  <text x="516" y="188" fill="#ffffff" fill-opacity="0.6" font-size="12">自己紹介 / ヘッダ画像</text>
