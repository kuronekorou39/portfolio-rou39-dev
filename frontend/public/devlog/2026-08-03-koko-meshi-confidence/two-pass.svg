<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">2 回の答えで確からしさを測る</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">1 枚あたり 約 12 秒 → 約 24 秒</text>

  <rect x="24" y="128" width="90" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="69" y="163" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">写真</text>

  <line x1="118" y1="146" x2="148" y2="122" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="118" y1="170" x2="148" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="231" y="74" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">すぐ保存して一覧に出す</text>
  <rect x="156" y="84" width="150" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="231" y="117" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">1 回目の解析</text>

  <rect x="156" y="178" width="150" height="56" rx="10" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="231" y="211" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">2 回目(裏で)</text>

  <line x1="310" y1="116" x2="372" y2="146" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="202" x2="372" y2="172" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="130" width="116" height="58" rx="10" fill="#60a5fa" fill-opacity="0.25"/>
  <text x="438" y="164" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">答えを比べる</text>

  <line x1="500" y1="146" x2="552" y2="116" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="172" x2="552" y2="206" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="84" width="136" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="576" y="108" fill="#ffffff" fill-opacity="0.6" font-size="12">揃う</text>
  <text x="576" y="128" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">自信度 高</text>

  <rect x="560" y="172" width="136" height="80" rx="10" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="576" y="196" fill="#ffffff" fill-opacity="0.6" font-size="12">割れる</text>
  <text x="576" y="217" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">自信度 低</text>
  <text x="576" y="239" fill="#60a5fa" font-size="12" font-weight="700">候補から選べる</text>

  <text x="24" y="276" fill="#ffffff" fill-opacity="0.4" font-size="11">自信度はモデルに申告させず、観測できる事実から決める</text>
</svg>
