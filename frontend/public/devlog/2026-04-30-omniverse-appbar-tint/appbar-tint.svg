<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">スクロールでヘッダーが色づくのを止めた</text>

  <!-- 直す前 -->
  <text x="24" y="72" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <rect x="24" y="84" width="300" height="160" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="24" y="84" width="300" height="48" rx="10" fill="#f87171" fill-opacity="0.22" stroke="#f87171" stroke-opacity="0.7"/>
  <text x="40" y="113" fill="#ffffff" fill-opacity="0.85" font-size="13">ヘッダー</text>
  <text x="308" y="113" fill="#f87171" font-size="11" text-anchor="end">surfaceTint が重なる</text>
  <rect x="40" y="144" width="268" height="38" rx="6" fill="#60a5fa" fill-opacity="0.18"/>
  <text x="52" y="168" fill="#60a5fa" font-size="11">新着のハイライト</text>
  <rect x="40" y="190" width="268" height="38" rx="6" fill="#ffffff" fill-opacity="0.05"/>
  <text x="24" y="268" fill="#ffffff" fill-opacity="0.4" font-size="11">ハイライトがヘッダーまで広がったように見えた</text>

  <line x1="336" y1="164" x2="388" y2="164" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 直した後 -->
  <text x="396" y="72" fill="#60a5fa" font-size="12" font-weight="700">直した後</text>
  <rect x="396" y="84" width="300" height="160" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <line x1="396" y1="132" x2="696" y2="132" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="412" y="113" fill="#ffffff" fill-opacity="0.85" font-size="13">ヘッダー</text>
  <text x="680" y="113" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="end">色は変わらない</text>
  <rect x="412" y="144" width="268" height="38" rx="6" fill="#60a5fa" fill-opacity="0.18"/>
  <text x="424" y="168" fill="#60a5fa" font-size="11">新着のハイライト</text>
  <rect x="412" y="190" width="268" height="38" rx="6" fill="#ffffff" fill-opacity="0.05"/>
  <text x="396" y="268" fill="#60a5fa" font-size="12" font-weight="700">ColorScheme.surfaceTint を透明に</text>
</svg>
