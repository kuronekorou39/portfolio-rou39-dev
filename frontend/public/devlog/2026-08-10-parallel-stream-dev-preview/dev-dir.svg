<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8b8e"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">release の中に、確認用の /dev/ を置く</text>

  <!-- main -->
  <rect x="24" y="130" width="190" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="119" y="166" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">main</text>
  <text x="119" y="188" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">作業中の UI</text>

  <!-- release -->
  <rect x="396" y="60" width="300" height="216" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="412" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">release ブランチ(配信元)</text>
  <rect x="412" y="100" width="268" height="66" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="428" y="128" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">/</text>
  <text x="428" y="150" fill="#ffffff" fill-opacity="0.6" font-size="12">公開中の UI</text>
  <rect x="412" y="182" width="268" height="78" rx="8" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="428" y="210" fill="#60a5fa" font-size="13" font-weight="700">/dev/</text>
  <text x="428" y="232" fill="#ffffff" fill-opacity="0.6" font-size="12">確認用ページ + 対応する ZIP</text>

  <!-- 矢印 -->
  <line x1="218" y1="150" x2="404" y2="132" stroke="#8a8b8e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dim)"/>
  <text x="306" y="124" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">公開するときだけ</text>
  <line x1="218" y1="192" x2="404" y2="220" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="306" y="234" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">作業中の UI を写す</text>
</svg>
