  <line x1="368" y1="84" x2="396" y2="84" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrowg)"/>
  <rect x="404" y="60" width="292" height="48" rx="8" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.7"/>
