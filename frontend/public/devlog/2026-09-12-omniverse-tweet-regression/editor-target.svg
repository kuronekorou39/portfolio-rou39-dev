<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="270" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">X の本文欄: どの要素に入力するか</text>

  <!-- ルート -->
  <rect x="24" y="64" width="410" height="156" rx="10" fill="#f87171" fill-opacity="0.05" stroke="#f87171" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="40" y="90" fill="#ffffff" fill-opacity="0.6" font-size="12">本文欄のルート要素</text>
  <rect x="40" y="106" width="180" height="96" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="130" y="150" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">プレースホルダ</text>
  <text x="130" y="172" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">編集できない</text>
  <rect x="236" y="106" width="182" height="96" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa"/>
  <text x="327" y="150" fill="#ffffff" fill-opacity="0.9" font-size="13" font-weight="700" text-anchor="middle">本体</text>
  <text x="327" y="172" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">編集できる</text>

  <!-- 直す前 -->
  <line x1="486" y1="92" x2="438" y2="92" stroke="#f87171" stroke-width="2" marker-end="url(#r)"/>
  <rect x="488" y="64" width="208" height="64" rx="8" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="504" y="87" fill="#f87171" font-size="11" font-weight="700">直す前: ルートごと選択</text>
  <text x="504" y="111" fill="#ffffff" fill-opacity="0.85" font-size="12">文字の挿入が無視される</text>

  <!-- 直した後 -->
  <line x1="486" y1="176" x2="422" y2="160" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
  <rect x="488" y="150" width="208" height="64" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="504" y="173" fill="#60a5fa" font-size="11" font-weight="700">直した後: 本体だけを対象</text>
  <text x="504" y="197" fill="#ffffff" fill-opacity="0.85" font-size="12">入力も読み取りも本体に</text>

  <text x="24" y="248" fill="#ffffff" fill-opacity="0.4" font-size="11">全選択は、中身が先に入っているときだけ</text>
</svg>
