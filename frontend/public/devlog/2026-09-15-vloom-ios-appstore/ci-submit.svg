<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">タグの push から App Store Connect まで</text>

  <rect x="24" y="118" width="124" height="68" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="86" y="148" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">タグを push</text>
  <text x="86" y="170" fill="#ffffff" fill-opacity="0.5" font-size="12" text-anchor="middle">手元に Mac なし</text>

  <line x1="152" y1="152" x2="172" y2="152" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CI -->
  <rect x="180" y="64" width="372" height="176" rx="10" fill="#60a5fa" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="196" y="92" fill="#60a5fa" font-size="13" font-weight="700">＋ CI の提出ジョブ</text>
  <text x="536" y="92" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">macOS ランナー</text>
  <g text-anchor="middle" font-size="12" fill="#ffffff" fill-opacity="0.85">
    <rect x="192" y="122" width="108" height="60" rx="6" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="246" y="157">証明書の取込</text>
    <rect x="312" y="122" width="108" height="60" rx="6" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="366" y="148">プライバシー</text>
    <text x="366" y="166">マニフェスト検査</text>
    <rect x="432" y="122" width="108" height="60" rx="6" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="486" y="148">署名つき IPA</text>
    <text x="486" y="166">の書き出し</text>
  </g>
  <g stroke="#60a5fa" stroke-width="2">
    <line x1="301" y1="152" x2="309" y2="152"/>
    <line x1="421" y1="152" x2="429" y2="152"/>
  </g>
  <text x="196" y="218" fill="#ffffff" fill-opacity="0.45" font-size="12">Info.plist: 暗号化の申告 / マイクの用途文言</text>

  <line x1="556" y1="152" x2="576" y2="152" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="584" y="118" width="112" height="68" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="640" y="148" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">App Store</text>
  <text x="640" y="168" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">Connect</text>
</svg>
