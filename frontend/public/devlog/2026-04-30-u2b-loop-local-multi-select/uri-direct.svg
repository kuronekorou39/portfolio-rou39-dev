<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">ローカル動画を複数選んでから一覧に出るまで</text>

  <!-- 直す前 -->
  <text x="24" y="76" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <rect x="24" y="88" width="130" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="89" y="119" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">複数を選択</text>
  <line x1="160" y1="114" x2="178" y2="114" stroke="#f87171" stroke-width="2" marker-end="url(#arrowr)"/>
  <rect x="184" y="88" width="362" height="52" rx="8" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="365" y="119" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">選んだ動画をキャッシュへコピー(遅い)</text>
  <line x1="552" y1="114" x2="570" y2="114" stroke="#f87171" stroke-width="2" marker-end="url(#arrowr)"/>
  <rect x="576" y="88" width="120" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="636" y="119" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">1 件ずつ登録</text>

  <!-- 直した後 -->
  <text x="24" y="186" fill="#60a5fa" font-size="12" font-weight="700">直した後(v1.51.7)</text>
  <rect x="24" y="198" width="130" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="89" y="229" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">複数を選択</text>
  <line x1="160" y1="224" x2="178" y2="224" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="184" y="198" width="170" height="52" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="269" y="229" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">URI をそのまま使う</text>
  <line x1="360" y1="224" x2="378" y2="224" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="384" y="198" width="130" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="449" y="229" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">一括で登録</text>
  <line x1="520" y1="224" x2="538" y2="224" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="544" y="198" width="152" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="5 4"/>
  <text x="620" y="229" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">サムネイルは裏で</text>
  <text x="449" y="274" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">ここで一覧に出る</text>
</svg>
