<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">シートを閉じたあとの検索欄</text>

  <!-- 直す前 -->
  <text x="24" y="78" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <rect x="24" y="90" width="320" height="46" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="184" y="118" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">シートごとに個別に閉じる</text>
  <line x1="184" y1="140" x2="184" y2="158" stroke="#f87171" stroke-width="2" marker-end="url(#arrowr)"/>
  <rect x="24" y="164" width="320" height="46" rx="8" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="184" y="192" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">検索欄にフォーカスが戻る</text>
  <line x1="184" y1="214" x2="184" y2="232" stroke="#f87171" stroke-width="2" marker-end="url(#arrowr)"/>
  <rect x="24" y="238" width="320" height="46" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="184" y="266" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">キーボードが勝手に出る</text>

  <!-- 直した後 -->
  <text x="376" y="78" fill="#60a5fa" font-size="12" font-weight="700">直した後(v1.28.3)</text>
  <rect x="376" y="90" width="320" height="46" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="536" y="118" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">全シートを同じ入口から開く</text>
  <line x1="536" y1="140" x2="536" y2="158" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="376" y="164" width="320" height="46" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="536" y="192" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">共通ラッパー: 閉じたら unfocus</text>
  <line x1="536" y1="214" x2="536" y2="232" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="376" y="238" width="320" height="46" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="536" y="266" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">キーボードは出ない</text>
</svg>
