<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, sans-serif">
  <rect width="720" height="340" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">Web 版の受信が走査する範囲</text>

  <!-- 直す前 -->
  <rect x="24" y="60" width="324" height="256" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">直す前</text>
  <rect x="48" y="100" width="150" height="200" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.3"/>
  <rect x="63" y="106" width="120" height="188" fill="#ffffff" fill-opacity="0.12"/>
  <g fill="#ffffff" fill-opacity="0.7">
    <rect x="63" y="106" width="14" height="14"/>
    <rect x="169" y="106" width="14" height="14"/>
    <rect x="63" y="280" width="14" height="14"/>
    <rect x="169" y="280" width="14" height="14"/>
  </g>
  <rect x="48" y="125" width="150" height="150" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="216" y="170" fill="#f87171" font-size="13" font-weight="700">中央の切り出しだけ</text>
  <text x="216" y="196" fill="#ffffff" fill-opacity="0.6" font-size="12">縦長の 13x18 は</text>
  <text x="216" y="216" fill="#ffffff" fill-opacity="0.6" font-size="12">四隅が外に出る</text>

  <!-- 直した後 -->
  <rect x="372" y="60" width="324" height="256" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="388" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">直した後(アプリと同じ方式)</text>
  <rect x="396" y="100" width="150" height="200" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-width="2"/>
  <rect x="411" y="106" width="120" height="188" fill="#ffffff" fill-opacity="0.12"/>
  <g fill="#60a5fa">
    <rect x="411" y="106" width="14" height="14"/>
    <rect x="517" y="106" width="14" height="14"/>
    <rect x="411" y="280" width="14" height="14"/>
    <rect x="517" y="280" width="14" height="14"/>
  </g>
  <text x="564" y="170" fill="#60a5fa" font-size="13" font-weight="700">フレーム全体</text>
  <text x="564" y="196" fill="#ffffff" fill-opacity="0.6" font-size="12">四隅のマーカーを</text>
  <text x="564" y="216" fill="#ffffff" fill-opacity="0.6" font-size="12">先に直接検出</text>
</svg>
