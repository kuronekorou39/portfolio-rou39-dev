<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, sans-serif">
  <rect width="720" height="280" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">出題から判定までのステップ</text>

  <!-- 前 -->
  <text x="24" y="105" fill="#f87171" font-size="12" font-weight="700">前</text>
  <g font-size="13" text-anchor="middle" fill="#ffffff" fill-opacity="0.6">
    <rect x="60" y="80" width="150" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="135" y="105">① 問題を用意</text>
    <rect x="222" y="80" width="150" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#f87171" stroke-opacity="0.6"/>
    <text x="297" y="105">② 全員に出題</text>
    <rect x="384" y="80" width="150" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#f87171" stroke-opacity="0.6"/>
    <text x="459" y="105">③ 早押し受付</text>
    <rect x="546" y="80" width="150" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="621" y="105">④ 判定</text>
  </g>
  <line x1="378" y1="70" x2="378" y2="134" stroke="#f87171" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="378" y="152" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">押せるまでに間があった</text>

  <!-- 後 -->
  <text x="24" y="215" fill="#60a5fa" font-size="12" font-weight="700">後</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="190" width="150" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="135" y="215" fill="#ffffff" fill-opacity="0.6">① 用意</text>
    <rect x="222" y="190" width="312" height="40" rx="8" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa"/>
    <text x="378" y="215" fill="#ffffff" font-weight="700">② 出題・早押し</text>
    <rect x="546" y="190" width="150" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="621" y="215" fill="#ffffff" fill-opacity="0.6">③ 判定</text>
  </g>
  <text x="378" y="254" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">「出題開始」1 つで表示と受付を 1 回の配信に</text>
</svg>
