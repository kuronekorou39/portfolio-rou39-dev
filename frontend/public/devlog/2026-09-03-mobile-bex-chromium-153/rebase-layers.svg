<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">土台を入れ替え、パッチを載せ直した</text>

  <!-- 前 -->
  <text x="40" y="76" fill="#ffffff" fill-opacity="0.45" font-size="12">前</text>
  <rect x="40" y="88" width="250" height="96" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="165" y="141" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">BEX のパッチ</text>
  <rect x="40" y="192" width="250" height="96" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="165" y="236" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">Chromium 147</text>
  <text x="165" y="258" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="middle">2026 年 2 月</text>

  <line x1="306" y1="188" x2="372" y2="188" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 後 -->
  <text x="390" y="76" fill="#ffffff" fill-opacity="0.45" font-size="12">後</text>
  <rect x="390" y="116" width="180" height="68" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="480" y="155" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">載せ直したパッチ</text>
  <rect x="582" y="116" width="114" height="68" rx="8" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa"/>
  <text x="639" y="155" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">新規 46</text>
  <rect x="390" y="192" width="306" height="96" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="406" y="222" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">Chromium 153</text>
  <text x="406" y="244" fill="#ffffff" fill-opacity="0.6" font-size="12">半年分のセキュリティ修正</text>
  <rect x="566" y="232" width="118" height="44" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-dasharray="4 4"/>
  <text x="625" y="259" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">上流に入った 8 本</text>
</svg>
