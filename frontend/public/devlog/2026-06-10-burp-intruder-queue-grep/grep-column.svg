<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">grep の設定が結果の表に出るまで</text>

  <g font-size="13" text-anchor="middle">
    <rect x="24" y="64" width="190" height="60" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="119" y="90" fill="#ffffff" fill-opacity="0.85">設定画面の grep</text>
    <text x="119" y="110" fill="#ffffff" fill-opacity="0.4" font-size="11">これまで未配線</text>
    <line x1="218" y1="94" x2="262" y2="94" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="266" y="64" width="190" height="60" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="361" y="90" fill="#60a5fa" font-weight="700">ジョブへコピー</text>
    <text x="361" y="110" fill="#ffffff" fill-opacity="0.5" font-size="11">キューに積むとき</text>
    <line x1="460" y1="94" x2="504" y2="94" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="508" y="64" width="188" height="60" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="602" y="90" fill="#60a5fa" font-weight="700">レスポンスと照合</text>
    <text x="602" y="110" fill="#ffffff" fill-opacity="0.5" font-size="11">ヘッダ + ボディ</text>
  </g>
  <line x1="602" y1="128" x2="602" y2="160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 結果の表 -->
  <rect x="24" y="166" width="672" height="120" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="192" fill="#ffffff" fill-opacity="0.45" font-size="12">結果の表</text>
  <rect x="508" y="174" width="180" height="104" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="522" y="196" fill="#60a5fa" font-size="12" font-weight="700">Grep 列</text>
  <g fill="#ffffff" fill-opacity="0.1">
    <rect x="40" y="210" width="120" height="14" rx="4"/>
    <rect x="180" y="210" width="80" height="14" rx="4"/>
    <rect x="280" y="210" width="200" height="14" rx="4"/>
    <rect x="40" y="246" width="120" height="14" rx="4"/>
    <rect x="180" y="246" width="80" height="14" rx="4"/>
    <rect x="280" y="246" width="200" height="14" rx="4"/>
  </g>
  <line x1="40" y1="235" x2="496" y2="235" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="522" y="222" fill="#ffffff" fill-opacity="0.85" font-size="12">マッチした文字列, …</text>
  <text x="522" y="258" fill="#ffffff" fill-opacity="0.4" font-size="12">(マッチなし)</text>
</svg>
