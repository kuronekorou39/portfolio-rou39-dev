<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">三点メニュー: 足した 2 項目にアイコンを付けた</text>

  <!-- 前 -->
  <text x="60" y="70" fill="#f87171" font-size="12" font-weight="700">前: 字下げに見える</text>
  <rect x="60" y="82" width="250" height="214" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="68" y="92" width="234" height="92" rx="6" fill="#f87171" fill-opacity="0.1"/>
  <g font-size="14" fill="#ffffff" fill-opacity="0.85">
    <text x="120" y="121">小窓表示</text>
    <text x="120" y="167">ハードリロード</text>
    <text x="120" y="217">新しいタブ</text>
    <text x="120" y="263">履歴</text>
  </g>
  <g fill="#ffffff" fill-opacity="0.45">
    <rect x="80" y="202" width="20" height="20" rx="5"/>
    <rect x="80" y="248" width="20" height="20" rx="5"/>
  </g>
  <g fill="none" stroke="#f87171" stroke-dasharray="3 3">
    <rect x="80" y="106" width="20" height="20" rx="5"/>
    <rect x="80" y="152" width="20" height="20" rx="5"/>
  </g>

  <line x1="326" y1="190" x2="392" y2="190" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 後 -->
  <text x="410" y="70" fill="#60a5fa" font-size="12" font-weight="700">後: 行頭が揃う</text>
  <rect x="410" y="82" width="250" height="214" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <g font-size="14" fill="#ffffff" fill-opacity="0.85">
    <text x="470" y="121">小窓表示</text>
    <text x="470" y="167">ハードリロード</text>
    <text x="470" y="217">新しいタブ</text>
    <text x="470" y="263">履歴</text>
  </g>
  <g fill="#60a5fa">
    <rect x="430" y="106" width="20" height="20" rx="5"/>
    <rect x="430" y="152" width="20" height="20" rx="5"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.45">
    <rect x="430" y="202" width="20" height="20" rx="5"/>
    <rect x="430" y="248" width="20" height="20" rx="5"/>
  </g>
</svg>
