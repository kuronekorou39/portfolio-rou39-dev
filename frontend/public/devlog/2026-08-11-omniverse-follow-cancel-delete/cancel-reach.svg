<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="250" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">「中断」がどこまで届くか</text>

  <rect x="24" y="106" width="120" height="70" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="84" y="146" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">中断ボタン</text>

  <rect x="200" y="106" width="140" height="70" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="270" y="146" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">ジョブ制御</text>

  <!-- 直す前 -->
  <line x1="144" y1="124" x2="198" y2="124" stroke="#f87171" stroke-width="2" marker-end="url(#r)"/>
  <line x1="340" y1="124" x2="388" y2="124" stroke="#f87171" stroke-width="2"/>
  <path d="M392 117l12 14M404 117l-12 14" stroke="#f87171" stroke-width="2" fill="none"/>
  <text x="344" y="108" fill="#f87171" font-size="11" font-weight="700">直す前: 届かない</text>

  <!-- 直した後 -->
  <line x1="144" y1="160" x2="198" y2="160" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="160" x2="468" y2="160" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
  <text x="404" y="180" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">取得口まで通す</text>

  <rect x="470" y="64" width="226" height="156" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="486" y="90" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">取得口の WebView</text>
  <rect x="486" y="104" width="194" height="44" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="498" y="131" fill="#ffffff" fill-opacity="0.85" font-size="12">最大 60 秒の待機</text>
  <rect x="486" y="158" width="194" height="44" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="498" y="185" fill="#ffffff" fill-opacity="0.85" font-size="12">ページ内の通信</text>

  <text x="24" y="204" fill="#ffffff" fill-opacity="0.6" font-size="11">押した瞬間に「中断しています…」</text></svg>
