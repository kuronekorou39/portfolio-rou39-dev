<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">チャットのコメントが映像の上を流れるまで</text>

  <!-- 枠の中 -->
  <rect x="24" y="64" width="230" height="220" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">枠の中(content script)</text>
  <rect x="40" y="104" width="198" height="120" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.25"/>
  <g fill="#ffffff" fill-opacity="0.18">
    <rect x="52" y="118" width="150" height="12" rx="3"/>
    <rect x="52" y="140" width="110" height="12" rx="3"/>
    <rect x="52" y="162" width="170" height="12" rx="3"/>
  </g>
  <rect x="52" y="190" width="130" height="16" rx="3" fill="#60a5fa" fill-opacity="0.6"/>
  <text x="40" y="250" fill="#60a5fa" font-size="12" font-weight="700">チャットの DOM を監視</text>
  <text x="40" y="270" fill="#ffffff" fill-opacity="0.4" font-size="11">新着のコメントを拾う</text>

  <!-- 送る -->
  <line x1="264" y1="164" x2="386" y2="164" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="150" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">postMessage</text>
  <text x="325" y="186" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">送り主で枠を特定</text>

  <!-- 親 -->
  <rect x="396" y="64" width="300" height="220" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="412" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">親ページ: 映像の上に描く</text>
  <rect x="412" y="104" width="268" height="150" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.25"/>
  <g font-size="14" font-weight="700" fill="#60a5fa">
    <text x="580" y="134">コメント</text>
    <text x="440" y="164" fill-opacity="0.75">コメント</text>
    <text x="530" y="194" fill-opacity="0.9">コメント</text>
  </g>
  <line x1="664" y1="228" x2="432" y2="228" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="412" y="274" fill="#ffffff" fill-opacity="0.4" font-size="11">レーンを割り当てて重なりを避ける</text>
</svg>
