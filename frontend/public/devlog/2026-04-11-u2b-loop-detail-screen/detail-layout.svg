<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">詳細画面の並び: 10 段から 6 段へ</text>

  <!-- 直す前 -->
  <text x="60" y="76" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <rect x="60" y="88" width="250" height="334" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="70" y="96" width="230" height="48" rx="8"/>
    <rect x="70" y="150" width="230" height="24" rx="8"/>
    <rect x="70" y="180" width="230" height="24" rx="8"/>
    <rect x="70" y="210" width="230" height="24" rx="8"/>
    <rect x="70" y="240" width="230" height="24" rx="8"/>
  </g>
  <g fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.6">
    <rect x="70" y="270" width="230" height="24" rx="8"/>
    <rect x="70" y="300" width="230" height="24" rx="8"/>
    <rect x="70" y="330" width="230" height="24" rx="8"/>
    <rect x="70" y="360" width="230" height="24" rx="8"/>
    <rect x="70" y="390" width="230" height="24" rx="8"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#ffffff" fill-opacity="0.6">
    <text x="185" y="124">サムネイル</text>
    <text x="185" y="166">再生ボタン</text>
    <text x="185" y="196">タイトル</text>
    <text x="185" y="226">備考</text>
    <text x="185" y="256">タグ</text>
    <text x="185" y="286">再生回数</text>
    <text x="185" y="316">URL のカード</text>
    <text x="185" y="346">ソース情報のカード</text>
    <text x="185" y="376">AB 区間の一覧</text>
    <text x="185" y="406">AB 区間の編集ボタン</text>
  </g>

  <line x1="326" y1="240" x2="388" y2="240" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 直した後 -->
  <text x="404" y="76" fill="#60a5fa" font-size="12" font-weight="700">直した後</text>
  <rect x="404" y="88" width="250" height="214" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="414" y="96" width="230" height="48" rx="8"/>
    <rect x="414" y="180" width="230" height="24" rx="8"/>
    <rect x="414" y="210" width="230" height="24" rx="8"/>
    <rect x="414" y="240" width="230" height="24" rx="8"/>
  </g>
  <g fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-opacity="0.6">
    <rect x="414" y="150" width="230" height="24" rx="8"/>
    <rect x="414" y="270" width="230" height="24" rx="8"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#ffffff" fill-opacity="0.6">
    <text x="529" y="124">サムネイル</text>
    <text x="529" y="196">タイトル</text>
    <text x="529" y="226">備考</text>
    <text x="529" y="256">タグ</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#ffffff" fill-opacity="0.85" font-weight="700">
    <text x="529" y="166">再生 + 回数・速度・URL</text>
    <text x="529" y="286">AB 区間(一覧 + 編集)</text>
  </g>
  <text x="529" y="330" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">赤の段を青に統合。ソース情報は廃止</text>
