<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">対象画面: 3 タブの往復を、1 ページとシートに</text>

  <!-- 直す前 -->
  <rect x="24" y="56" width="300" height="304" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="80" fill="#f87171" font-size="12" font-weight="700">直す前: 3 タブ</text>
  <g font-size="12" text-anchor="middle" fill="#ffffff" fill-opacity="0.6">
    <text x="82" y="112">概要</text>
    <text x="174" y="112">履歴</text>
    <text x="266" y="112">設定</text>
  </g>
  <line x1="40" y1="124" x2="308" y2="124" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="40" y="150" width="100" height="36" rx="8" fill="#ffffff" fill-opacity="0.1"/>
  <text x="90" y="173" fill="#ffffff" fill-opacity="0.85" font-size="12" text-anchor="middle">今すぐ取得</text>
  <rect x="200" y="250" width="108" height="36" rx="8" fill="#ffffff" fill-opacity="0.1"/>
  <text x="254" y="273" fill="#ffffff" fill-opacity="0.85" font-size="12" text-anchor="middle">実行アカウント</text>
  <polyline points="142,168 266,168 266,248" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#r)"/>
  <polyline points="198,268 82,268 82,188" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#r)"/>
  <text x="150" y="158" fill="#f87171" font-size="11">失敗したら設定へ</text>
  <text x="92" y="288" fill="#f87171" font-size="11">戻って取り直す</text>

  <line x1="324" y1="208" x2="394" y2="208" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>

  <!-- 直した後 -->
  <rect x="396" y="56" width="300" height="304" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="412" y="80" fill="#60a5fa" font-size="12" font-weight="700">1 ページ</text>
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="412" y="92" width="84" height="40" rx="6"/>
    <rect x="504" y="92" width="84" height="40" rx="6"/>
    <rect x="596" y="92" width="84" height="40" rx="6"/>
  </g>
  <rect x="412" y="144" width="268" height="36" rx="8" fill="#60a5fa" fill-opacity="0.3"/>
  <text x="546" y="167" fill="#ffffff" fill-opacity="0.9" font-size="13" font-weight="700" text-anchor="middle">今すぐ取得</text>
  <line x1="546" y1="180" x2="546" y2="196" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
  <rect x="412" y="198" width="268" height="146" rx="10" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="428" y="222" fill="#ffffff" fill-opacity="0.4" font-size="11">1 枚のシートで決める</text>
  <g font-size="13" fill="#ffffff" fill-opacity="0.85">
    <text x="428" y="254">種別</text>
    <text x="428" y="288">実行アカウント</text>
    <text x="428" y="322">所要の目安</text>
  </g>
  <rect x="604" y="244" width="60" height="8" rx="3" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="584" y="278" width="80" height="8" rx="3" fill="#ffffff" fill-opacity="0.2"/>
  <text x="664" y="322" fill="#60a5fa" font-size="11" text-anchor="end">前回の実績</text>
  <line x1="428" y1="266" x2="664" y2="266" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="428" y1="300" x2="664" y2="300" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
