<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">出題カードのステップ表示(②のとき)</text>

  <rect x="24" y="56" width="672" height="234" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- ステップ -->
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="76" width="150" height="38" rx="8" fill="#ffffff" fill-opacity="0.04"/>
    <text x="115" y="100" fill="#ffffff" fill-opacity="0.3">① 問題を用意</text>
    <rect x="202" y="76" width="150" height="38" rx="8" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa"/>
    <text x="277" y="100" fill="#ffffff" font-weight="700">② 全員に出題</text>
    <rect x="364" y="76" width="150" height="38" rx="8" fill="#ffffff" fill-opacity="0.04"/>
    <text x="439" y="100" fill="#ffffff" fill-opacity="0.6">③ 早押し受付</text>
    <rect x="526" y="76" width="150" height="38" rx="8" fill="#ffffff" fill-opacity="0.04"/>
    <text x="601" y="100" fill="#ffffff" fill-opacity="0.6">④ 判定</text>
  </g>
  <text x="115" y="132" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">済みは薄く</text>
  <text x="277" y="132" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">現在地</text>

  <!-- ヒント -->
  <text x="40" y="164" fill="#60a5fa" font-size="13">全員が問題を読んだら「早押し開始」へ</text>
  <text x="676" y="164" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="end">次の操作を 1 行で</text>

  <!-- 問題文 -->
  <rect x="40" y="178" width="636" height="40" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="54" y="203" fill="#ffffff" fill-opacity="0.4" font-size="12">問題文</text>

  <!-- ボタン -->
  <rect x="36" y="228" width="208" height="50" rx="12" fill="none" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="40" y="232" width="200" height="42" rx="8" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa"/>
  <text x="140" y="258" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">早押し開始</text>
  <text x="260" y="258" fill="#ffffff" fill-opacity="0.4" font-size="11">次に押すボタンが脈動する</text>
</svg>
