<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">出題者を中心にしたスター型の P2P</text>

  <!-- トラッカー -->
  <rect x="268" y="56" width="184" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="360" y="81" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">BitTorrent トラッカー</text>
  <text x="464" y="80" fill="#ffffff" fill-opacity="0.4" font-size="11">接続の仲介</text>
  <line x1="290" y1="96" x2="200" y2="120" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="430" y1="96" x2="560" y2="120" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 出題者 -->
  <rect x="24" y="120" width="240" height="150" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="146" fill="#ffffff" fill-opacity="0.45" font-size="12">出題者の端末</text>
  <rect x="40" y="160" width="208" height="94" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="54" y="186" fill="#60a5fa" font-size="13" font-weight="700">押下順の判定</text>
  <text x="54" y="210" fill="#ffffff" fill-opacity="0.6" font-size="12">時計のずれを換算</text>
  <text x="54" y="234" fill="#ffffff" fill-opacity="0.6" font-size="12">得点 / 再接続の引き継ぎ</text>

  <!-- 直結 -->
  <line x1="264" y1="195" x2="500" y2="141" stroke="#60a5fa" stroke-width="2"/>
  <line x1="264" y1="195" x2="500" y2="195" stroke="#60a5fa" stroke-width="2"/>
  <line x1="264" y1="195" x2="500" y2="249" stroke="#60a5fa" stroke-width="2"/>
  <text x="382" y="146" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">WebRTC で直結</text>
  <text x="382" y="266" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">サーバなし</text>

  <!-- 回答者 -->
  <g font-size="13" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">
    <rect x="500" y="120" width="196" height="42" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="598" y="146">回答者のスマホ</text>
    <rect x="500" y="174" width="196" height="42" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="598" y="200">回答者のスマホ</text>
    <rect x="500" y="228" width="196" height="42" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="598" y="254">回答者のスマホ</text>
  </g>
</svg>
