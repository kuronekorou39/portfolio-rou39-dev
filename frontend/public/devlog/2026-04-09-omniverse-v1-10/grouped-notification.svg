<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">同じ投稿へのリアクションを 1 件にまとめる</text>

  <!-- これまで -->
  <text x="24" y="74" fill="#ffffff" fill-opacity="0.45" font-size="12">これまで</text>
  <g fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="24" y="88" width="280" height="48" rx="8"/>
    <rect x="24" y="146" width="280" height="48" rx="8"/>
    <rect x="24" y="204" width="280" height="48" rx="8"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.18">
    <circle cx="52" cy="112" r="12"/>
    <circle cx="52" cy="170" r="12"/>
    <circle cx="52" cy="228" r="12"/>
  </g>
  <g font-size="12" fill="#ffffff" fill-opacity="0.6">
    <text x="76" y="116">○○ がいいねしました</text>
    <text x="76" y="174">△△ がいいねしました</text>
    <text x="76" y="232">□□ がいいねしました</text>
  </g>

  <line x1="318" y1="170" x2="382" y2="170" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- v1.10.0 -->
  <text x="396" y="74" fill="#60a5fa" font-size="12" font-weight="700">v1.10.0</text>
  <rect x="396" y="122" width="300" height="96" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.8"/>
  <circle cx="424" cy="150" r="12" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="442" cy="150" r="12" fill="#ffffff" fill-opacity="0.22" stroke="#0b0c10" stroke-width="2"/>
  <circle cx="460" cy="150" r="12" fill="#ffffff" fill-opacity="0.16" stroke="#0b0c10" stroke-width="2"/>
  <text x="412" y="194" fill="#ffffff" fill-opacity="0.85" font-size="13">○○、△△、他 1 人がいいねしました</text>
  <text x="396" y="244" fill="#ffffff" fill-opacity="0.4" font-size="11">「すべて」タブでは宛先のアバターも出す</text>
</svg>
