<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">iOS: 1 回ごとに WebView へ渡す画像</text>

  <!-- 直す前 -->
  <text x="24" y="78" fill="#f87171" font-size="12" font-weight="700">直す前: 累積した全枚を毎回</text>
  <g fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="24" y="90" width="150" height="76" rx="8"/>
    <rect x="200" y="90" width="150" height="76" rx="8"/>
    <rect x="376" y="90" width="150" height="76" rx="8"/>
  </g>
  <g font-size="11" fill="#ffffff" fill-opacity="0.4">
    <text x="36" y="110">1 回目</text>
    <text x="212" y="110">2 回目</text>
    <text x="388" y="110">3 回目</text>
  </g>
  <g fill="#f87171" fill-opacity="0.3">
    <rect x="36" y="122" width="30" height="30" rx="5"/>
    <rect x="212" y="122" width="30" height="30" rx="5"/>
    <rect x="248" y="122" width="30" height="30" rx="5"/>
    <rect x="388" y="122" width="30" height="30" rx="5"/>
    <rect x="424" y="122" width="30" height="30" rx="5"/>
    <rect x="460" y="122" width="30" height="30" rx="5"/>
  </g>
  <g font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">
    <text x="51" y="142">1</text>
    <text x="227" y="142">1</text>
    <text x="263" y="142">2</text>
    <text x="403" y="142">1</text>
    <text x="439" y="142">2</text>
    <text x="475" y="142">3</text>
  </g>
  <text x="548" y="122" fill="#f87171" font-size="12" font-weight="700">1 枚目が二重になる</text>
  <text x="548" y="144" fill="#ffffff" fill-opacity="0.6" font-size="11">base64 も枚数ぶん残る</text>

  <!-- 直した後 -->
  <text x="24" y="202" fill="#60a5fa" font-size="12" font-weight="700">直した後: 1 枚ごとに独立</text>
  <g fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="24" y="214" width="150" height="66" rx="8"/>
    <rect x="200" y="214" width="150" height="66" rx="8"/>
    <rect x="376" y="214" width="150" height="66" rx="8"/>
  </g>
  <g fill="#60a5fa" fill-opacity="0.35">
    <rect x="36" y="232" width="30" height="30" rx="5"/>
    <rect x="212" y="232" width="30" height="30" rx="5"/>
    <rect x="388" y="232" width="30" height="30" rx="5"/>
  </g>
  <g font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">
    <text x="51" y="252">1</text>
    <text x="227" y="252">2</text>
    <text x="403" y="252">3</text>
  </g>
  <text x="548" y="242" fill="#60a5fa" font-size="12" font-weight="700">使い終わったら捨てる</text>
  <text x="548" y="264" fill="#ffffff" fill-opacity="0.6" font-size="11">base64 とファイルの参照</text>
</svg>
