<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">カテゴリの作成画面を、編集にも使う</text>

  <!-- 一覧 -->
  <rect x="24" y="60" width="290" height="206" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">カテゴリ一覧</text>
  <g font-size="13" fill="#ffffff" fill-opacity="0.7">
    <rect x="40" y="98" width="258" height="44" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="56" y="125">自分で作ったカテゴリ</text>
    <rect x="40" y="150" width="258" height="44" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="56" y="177">自分で作ったカテゴリ</text>
  </g>
  <rect x="236" y="106" width="52" height="28" rx="14" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="262" y="125" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">編集</text>
  <rect x="236" y="158" width="52" height="28" rx="14" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="262" y="177" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">編集</text>
  <text x="40" y="232" fill="#ffffff" fill-opacity="0.4" font-size="12">一覧に編集ボタンを足した</text>

  <line x1="292" y1="120" x2="400" y2="120" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 作成画面 -->
  <rect x="406" y="60" width="290" height="206" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="422" y="86" fill="#60a5fa" font-size="12" font-weight="700">作成画面(編集モード)</text>
  <rect x="422" y="98" width="258" height="44" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="438" y="125" fill="#ffffff" fill-opacity="0.85" font-size="13">いまのカテゴリ名</text>
  <rect x="422" y="150" width="258" height="44" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="438" y="177" fill="#ffffff" fill-opacity="0.4" font-size="13">ほかの項目</text>
  <rect x="580" y="212" width="100" height="36" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
  <text x="630" y="235" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">保存</text>
</svg>
