  <text x="119" y="188" fill="#ffffff" fill-opacity="0.6" font-size="17" font-weight="700" text-anchor="middle">beyond-qr</text>

  <line x1="226" y1="166" x2="288" y2="166" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="60" width="396" height="216" rx="10" fill="#60a5fa" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="316" y="92" fill="#60a5fa" font-size="17" font-weight="700">Vloom</text>
  <text x="680" y="92" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">bloom の b → v / v-loom (織機)</text>
  <g text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.85">
    <rect x="316" y="108" width="176" height="46" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="404" y="136">表示名・アイコン</text>
    <rect x="504" y="108" width="176" height="46" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="592" y="136">Rust クレート</text>
    <rect x="316" y="166" width="176" height="46" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.15"/>
