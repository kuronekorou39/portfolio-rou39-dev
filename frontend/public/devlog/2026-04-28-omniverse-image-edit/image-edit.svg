<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">投稿前の画像編集: 並び替え・トリミング・フィルタ</text>

  <!-- サムネ列 -->
  <rect x="24" y="60" width="340" height="176" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">投稿画面のサムネ(最大 4 枚)</text>
  <rect x="40" y="106" width="64" height="64" rx="6" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="116" y="100" width="70" height="70" rx="6" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-width="2"/>
  <rect x="200" y="106" width="64" height="64" rx="6" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="276" y="106" width="64" height="64" rx="6" fill="#ffffff" fill-opacity="0.12"/>
  <line x1="151" y1="186" x2="226" y2="186" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="216" fill="#60a5fa" font-size="12" font-weight="700">長押しでドラッグ: 並び替え(1.08 倍で強調)</text>
  <text x="24" y="268" fill="#ffffff" fill-opacity="0.4" font-size="11">GIF はアニメーションを保つため、どの編集も対象外</text>

  <line x1="368" y1="138" x2="412" y2="138" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="126" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">タップ</text>

  <!-- トリミング -->
  <rect x="420" y="60" width="276" height="118" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="436" y="86" fill="#60a5fa" font-size="13" font-weight="700">トリミング</text>
  <rect x="540" y="76" width="140" height="86" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="560" y="90" width="92" height="58" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="436" y="108" fill="#ffffff" fill-opacity="0.6" font-size="12">矩形で切り抜く</text>

  <!-- フィルタ -->
  <rect x="420" y="190" width="276" height="110" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="436" y="216" fill="#60a5fa" font-size="13" font-weight="700">フィルタ(6 種)</text>
  <g fill="#60a5fa" fill-opacity="0.15">
    <rect x="436" y="228" width="76" height="26" rx="13"/>
    <rect x="520" y="228" width="76" height="26" rx="13"/>
    <rect x="604" y="228" width="76" height="26" rx="13"/>
    <rect x="436" y="262" width="76" height="26" rx="13"/>
    <rect x="520" y="262" width="76" height="26" rx="13"/>
    <rect x="604" y="262" width="76" height="26" rx="13"/>
  </g>
  <g font-size="11" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">
    <text x="474" y="245">明るく</text>
    <text x="558" y="245">暖色</text>
    <text x="642" y="245">寒色</text>
    <text x="474" y="279">モノクロ</text>
    <text x="558" y="279">セピア</text>
    <text x="642" y="279">ビビッド</text>
  </g>
</svg>
