<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.6"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">解析を 2 回まわし、答えが揃うかで決める</text>

  <!-- 1回目 -->
  <rect x="24" y="80" width="150" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="99" y="113" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700" text-anchor="middle">1 回目の解析</text>

  <line x1="99" y1="138" x2="99" y2="196" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="24" y="200" width="150" height="56" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="99" y="233" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">すぐ一覧に出す</text>

  <!-- 2回目 -->
  <line x1="176" y1="108" x2="252" y2="108" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="256" y="80" width="160" height="56" rx="10" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="336" y="113" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">裏で 2 回目</text>

  <!-- 判定 -->
  <line x1="418" y1="100" x2="488" y2="76" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="418" y1="118" x2="488" y2="162" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="452" y="70" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">揃う</text>
  <text x="440" y="164" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">割れる</text>

  <rect x="492" y="52" width="204" height="52" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="594" y="83" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">そのまま確定</text>

  <rect x="492" y="140" width="204" height="52" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="594" y="171" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">両方を候補にして選ばせる</text>

  <text x="492" y="230" fill="#ffffff" fill-opacity="0.4" font-size="11">揃ったかは料理名の重なりで測る</text>
</svg>
