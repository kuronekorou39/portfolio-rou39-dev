<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">同居していた 2 世代を 1 本にする</text>

  <!-- Phase 0 -->
  <rect x="24" y="60" width="324" height="124" rx="10" fill="#f87171" fill-opacity="0.06" stroke="#f87171" stroke-opacity="0.5"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">Phase 0</text>
  <text x="40" y="112" fill="#ffffff" fill-opacity="0.6" font-size="14" font-weight="700">8 色のカラーコード</text>
  <text x="40" y="136" fill="#ffffff" fill-opacity="0.4" font-size="12">RS 符号 + 色の量子化</text>
  <text x="40" y="166" fill="#f87171" font-size="13" font-weight="700">実機で破綻 → 全削除</text>

  <!-- Phase 1 -->
  <rect x="372" y="60" width="324" height="124" rx="10" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="388" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">Phase 1</text>
  <text x="388" y="112" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700">QR の動画ループ + Fountain</text>
  <text x="388" y="136" fill="#ffffff" fill-opacity="0.4" font-size="12">RaptorQ</text>
  <text x="388" y="166" fill="#60a5fa" font-size="13" font-weight="700">実機で転送に成功 → 残す</text>

  <!-- 残ったワークスペース -->
  <text x="24" y="222" fill="#ffffff" fill-opacity="0.45" font-size="12">残った Rust のワークスペース</text>
  <rect x="24" y="236" width="220" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="134" y="265" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">Fountain のコア</text>
  <line x1="254" y1="260" x2="336" y2="260" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="346" y="236" width="220" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="456" y="265" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">WASM に公開するクレート</text>
  <text x="696" y="265" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">削除 7,123 行</text>
</svg>
