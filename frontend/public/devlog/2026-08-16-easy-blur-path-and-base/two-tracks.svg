<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, sans-serif">
  <rect width="720" height="330" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">キーフレームを 2 本のトラックに分けた</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">横軸は動画の時刻</text>

  <!-- 前 -->
  <text x="24" y="92" fill="#f87171" font-size="12" font-weight="700">前: 1 本</text>
  <line x1="150" y1="88" x2="690" y2="88" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <g fill="#f87171" fill-opacity="0.8">
    <circle cx="170" cy="88" r="6"/><circle cx="240" cy="88" r="6"/><circle cx="300" cy="88" r="6"/>
    <circle cx="380" cy="88" r="6"/><circle cx="450" cy="88" r="6"/><circle cx="540" cy="88" r="6"/>
    <circle cx="620" cy="88" r="6"/>
  </g>
  <text x="150" y="118" fill="#ffffff" fill-opacity="0.4" font-size="12">1 つの点が位置もサイズも持つ</text>

  <line x1="24" y1="140" x2="696" y2="140" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- 経路 -->
  <text x="24" y="186" fill="#60a5fa" font-size="13" font-weight="700">経路</text>
  <text x="24" y="206" fill="#ffffff" fill-opacity="0.6" font-size="12">位置</text>
  <line x1="150" y1="182" x2="690" y2="182" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <g fill="#60a5fa">
    <circle cx="170" cy="182" r="4"/><circle cx="196" cy="182" r="4"/><circle cx="222" cy="182" r="4"/>
    <circle cx="250" cy="182" r="4"/><circle cx="280" cy="182" r="4"/><circle cx="306" cy="182" r="4"/>
    <circle cx="336" cy="182" r="4"/><circle cx="362" cy="182" r="4"/><circle cx="392" cy="182" r="4"/>
    <circle cx="420" cy="182" r="4"/><circle cx="446" cy="182" r="4"/><circle cx="476" cy="182" r="4"/>
    <circle cx="504" cy="182" r="4"/><circle cx="532" cy="182" r="4"/><circle cx="560" cy="182" r="4"/>
    <circle cx="590" cy="182" r="4"/><circle cx="620" cy="182" r="4"/>
  </g>
  <text x="150" y="212" fill="#ffffff" fill-opacity="0.4" font-size="12">ドラッグで追跡して記録する</text>

  <!-- 基準 -->
  <text x="24" y="266" fill="#60a5fa" font-size="13" font-weight="700">基準</text>
  <text x="24" y="286" fill="#ffffff" fill-opacity="0.6" font-size="12">サイズ・強度・回転</text>
  <line x1="150" y1="262" x2="690" y2="262" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="240" y1="262" x2="540" y2="262" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 4"/>
  <g fill="#60a5fa">
    <path d="M240 253 L249 262 L240 271 L231 262 z"/>
    <path d="M540 253 L549 262 L540 271 L531 262 z"/>
  </g>
  <text x="390" y="252" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">線形補間</text>
  <text x="150" y="296" fill="#ffffff" fill-opacity="0.4" font-size="12">好きな時刻に置く</text>
</svg>
