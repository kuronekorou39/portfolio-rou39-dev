<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">データの置き場所: 同期から端末内 + zip へ</text>

  <!-- 前 -->
  <rect x="24" y="60" width="256" height="216" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">これまで</text>
  <rect x="40" y="112" width="84" height="110" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="82" y="172" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">端末</text>
  <line x1="130" y1="167" x2="174" y2="167" stroke="#f87171" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="180" y="112" width="84" height="110" rx="8" fill="#0b0c10" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="222" y="146" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">クラウド</text>
  <text x="222" y="178" fill="#f87171" font-size="12" text-anchor="middle">認証</text>
  <text x="222" y="200" fill="#f87171" font-size="12" text-anchor="middle">同期</text>
  <text x="40" y="254" fill="#ffffff" fill-opacity="0.4" font-size="11">赤が撤去した部分</text>

  <!-- 後 -->
  <rect x="304" y="60" width="392" height="216" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="320" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">v0.8.0</text>
  <rect x="320" y="102" width="130" height="130" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="336" y="128" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">端末の中だけ</text>
  <text x="336" y="158" fill="#ffffff" fill-opacity="0.6" font-size="12">写真</text>
  <text x="336" y="182" fill="#ffffff" fill-opacity="0.6" font-size="12">記録</text>
  <text x="336" y="206" fill="#ffffff" fill-opacity="0.6" font-size="12">設定</text>

  <line x1="454" y1="167" x2="486" y2="167" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="494" y="137" width="64" height="60" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
  <text x="526" y="172" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700" text-anchor="middle">zip</text>
  <line x1="562" y1="167" x2="594" y2="167" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="602" y="137" width="78" height="60" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="641" y="172" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">別の端末</text>
  <text x="470" y="220" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">書き出し</text>
  <text x="578" y="220" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">復元</text>
  <text x="680" y="256" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="end">復元に失敗したら元に戻す</text>
</svg>
