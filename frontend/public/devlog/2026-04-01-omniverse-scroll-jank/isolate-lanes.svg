<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">JSON 解析を UI スレッドの外へ</text>

  <!-- 直す前 -->
  <text x="24" y="72" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <text x="24" y="105" fill="#ffffff" fill-opacity="0.6" font-size="12">UI スレッド</text>
  <rect x="120" y="84" width="576" height="32" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="136" y="105" fill="#ffffff" fill-opacity="0.6" font-size="12">スクロール</text>
  <rect x="300" y="84" width="220" height="32" fill="#f87171" fill-opacity="0.22" stroke="#f87171" stroke-opacity="0.7"/>
  <text x="410" y="105" fill="#ffffff" fill-opacity="0.85" font-size="12" text-anchor="middle">json.decode(約 650KB)</text>
  <text x="536" y="105" fill="#ffffff" fill-opacity="0.6" font-size="12">スクロール</text>
  <text x="410" y="136" fill="#f87171" font-size="12" text-anchor="middle">200〜500ms 止まる</text>

  <!-- 直した後 -->
  <text x="24" y="172" fill="#60a5fa" font-size="12" font-weight="700">直した後</text>
  <text x="24" y="205" fill="#ffffff" fill-opacity="0.6" font-size="12">UI スレッド</text>
  <rect x="120" y="184" width="576" height="32" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="136" y="205" fill="#ffffff" fill-opacity="0.6" font-size="12">スクロール</text>
  <text x="680" y="205" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="end">止まらない</text>

  <line x1="320" y1="218" x2="320" y2="246" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="246" x2="500" y2="220" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="237" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">compute()</text>

  <text x="24" y="269" fill="#ffffff" fill-opacity="0.6" font-size="12">別 Isolate</text>
  <rect x="120" y="248" width="576" height="32" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="300" y="248" width="220" height="32" fill="#60a5fa" fill-opacity="0.3" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="410" y="269" fill="#ffffff" fill-opacity="0.85" font-size="12" text-anchor="middle">json.decode</text>
</svg>
