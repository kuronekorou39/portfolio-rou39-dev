<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">「得点を隠す」のときの得点表</text>

  <!-- 出題者 -->
  <rect x="24" y="64" width="324" height="200" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">出題者の画面</text>
  <g font-size="13">
    <rect x="40" y="104" width="292" height="36" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="54" y="127" fill="#ffffff" fill-opacity="0.45">1位</text>
    <text x="100" y="127" fill="#ffffff" fill-opacity="0.85">C さん</text>
    <text x="318" y="127" fill="#ffffff" fill-opacity="0.85" font-weight="700" text-anchor="end">5</text>
    <rect x="40" y="148" width="292" height="36" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="54" y="171" fill="#ffffff" fill-opacity="0.45">2位</text>
    <text x="100" y="171" fill="#ffffff" fill-opacity="0.85">A さん</text>
    <text x="318" y="171" fill="#ffffff" fill-opacity="0.85" font-weight="700" text-anchor="end">3</text>
    <rect x="40" y="192" width="292" height="36" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="54" y="215" fill="#ffffff" fill-opacity="0.45">3位</text>
    <text x="100" y="215" fill="#ffffff" fill-opacity="0.85">B さん</text>
    <text x="318" y="215" fill="#ffffff" fill-opacity="0.85" font-weight="700" text-anchor="end">1</text>
  </g>
  <text x="40" y="250" fill="#ffffff" fill-opacity="0.4" font-size="11">常に得点順で見える</text>

  <!-- 回答者 -->
  <rect x="372" y="64" width="324" height="200" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="388" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">回答者の画面</text>
  <g font-size="13">
    <rect x="388" y="104" width="292" height="36" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="402" y="127" fill="#ffffff" fill-opacity="0.85">A さん</text>
    <text x="666" y="127" fill="#60a5fa" font-weight="700" text-anchor="end">非表示</text>
    <rect x="388" y="148" width="292" height="36" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="402" y="171" fill="#ffffff" fill-opacity="0.85">B さん</text>
    <text x="666" y="171" fill="#60a5fa" font-weight="700" text-anchor="end">非表示</text>
    <rect x="388" y="192" width="292" height="36" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="402" y="215" fill="#ffffff" fill-opacity="0.85">C さん</text>
    <text x="666" y="215" fill="#60a5fa" font-weight="700" text-anchor="end">非表示</text>
  </g>
  <text x="388" y="250" fill="#60a5fa" font-size="11" font-weight="700">参加順 / 得点と順位は伏せる</text>

  <text x="360" y="292" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">結果発表で初めて公開する</text>
</svg>
