<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">再生画面の横画面: 2 分割から全画面へ</text>

  <!-- v1.49 -->
  <text x="24" y="78" fill="#ffffff" fill-opacity="0.6" font-size="12" font-weight="700">v1.49: 左右 2 分割(60:40)</text>
  <rect x="24" y="90" width="320" height="180" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="34" y="100" width="180" height="96" rx="8" fill="#ffffff" fill-opacity="0.12"/>
  <text x="124" y="153" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">動画</text>
  <rect x="34" y="202" width="180" height="26" rx="8" fill="#ffffff" fill-opacity="0.08"/>
  <text x="124" y="220" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">操作</text>
  <rect x="34" y="234" width="180" height="26" rx="8" fill="#ffffff" fill-opacity="0.08"/>
  <text x="124" y="252" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">波形</text>
  <rect x="220" y="100" width="114" height="160" rx="8" fill="#ffffff" fill-opacity="0.08"/>
  <text x="277" y="185" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">パネル</text>

  <!-- v1.50 -->
  <text x="376" y="78" fill="#60a5fa" font-size="12" font-weight="700">v1.50: 横にしたら即全画面</text>
  <rect x="376" y="90" width="320" height="180" rx="10" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="480" y="170" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700" text-anchor="middle">動画</text>
  <rect x="396" y="226" width="180" height="32" rx="8" fill="#0b0c10" fill-opacity="0.6"/>
  <text x="486" y="246" fill="#ffffff" fill-opacity="0.85" font-size="11" text-anchor="middle">操作(4 秒で消える)</text>
  <rect x="590" y="98" width="98" height="164" rx="8" fill="#0b0c10" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <text x="639" y="176" fill="#ffffff" fill-opacity="0.85" font-size="12" text-anchor="middle">ドロワー</text>
  <text x="639" y="194" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">区間 / 一覧</text>
  <rect x="578" y="160" width="10" height="40" rx="4" fill="#ffffff" fill-opacity="0.6"/>

  <text x="24" y="298" fill="#ffffff" fill-opacity="0.4" font-size="11">AB 編集画面は 2 分割のまま</text>
  <text x="696" y="298" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="end">右端のタブでドロワーを引き出す / 縦に戻すと解除</text>
</svg>
