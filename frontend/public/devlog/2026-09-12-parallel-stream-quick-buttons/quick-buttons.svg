<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="system-ui, sans-serif">
  <rect width="720" height="330" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">右下の丸ボタン: 整列と追加</text>

  <!-- 画面 -->
  <rect x="24" y="56" width="672" height="250" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <g fill="#15161a" stroke="#ffffff" stroke-opacity="0.2">
    <rect x="38" y="70" width="318" height="150" rx="4"/>
    <rect x="364" y="70" width="318" height="150" rx="4"/>
  </g>
  <g font-size="13" fill="#ffffff" fill-opacity="0.3" text-anchor="middle">
    <text x="197" y="150">枠</text>
    <text x="523" y="150">枠</text>
  </g>

  <!-- 左下: メニュー -->
  <rect x="38" y="264" width="100" height="30" rx="6" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="88" y="284" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">≡ メニュー</text>
  <text x="150" y="284" fill="#ffffff" fill-opacity="0.4" font-size="11">これまでは、ここを開いてから</text>

  <!-- 右下: 丸ボタン -->
  <circle cx="600" cy="268" r="24" fill="#0b0c10" stroke="#60a5fa" stroke-width="2"/>
  <g fill="none" stroke="#60a5fa" stroke-width="2">
    <rect x="590" y="258" width="20" height="20" rx="2"/>
    <line x1="600" y1="258" x2="600" y2="278"/>
    <line x1="590" y1="268" x2="610" y2="268"/>
  </g>
  <circle cx="658" cy="268" r="24" fill="#60a5fa"/>
  <g stroke="#0b0c10" stroke-width="3" stroke-linecap="round">
    <line x1="658" y1="257" x2="658" y2="279"/>
    <line x1="647" y1="268" x2="669" y2="268"/>
  </g>
  <g font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">
    <text x="600" y="238">整列</text>
    <text x="658" y="238">追加</text>
  </g>
  <text x="560" y="272" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="end">無操作で消える</text>
</svg>
