<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">四隅のマーカーを 6 セルから 24 セルへ</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">幅 220 セルのフレーム / 模式図</text>

  <!-- v2 -->
  <rect x="24" y="60" width="324" height="236" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">これまで</text>
  <rect x="48" y="100" width="154" height="180" fill="#ffffff" fill-opacity="0.12"/>
  <g fill="#ffffff" fill-opacity="0.85">
    <rect x="48" y="100" width="5" height="5"/>
    <rect x="197" y="100" width="5" height="5"/>
    <rect x="48" y="275" width="5" height="5"/>
    <rect x="197" y="275" width="5" height="5"/>
  </g>
  <text x="222" y="160" fill="#ffffff" fill-opacity="0.6" font-size="13">マーカー 6 セル</text>
  <text x="222" y="196" fill="#ffffff" fill-opacity="0.85" font-size="20" font-weight="700">55%</text>
  <text x="222" y="220" fill="#ffffff" fill-opacity="0.45" font-size="12">検出率</text>

  <!-- v3 -->
  <rect x="372" y="60" width="324" height="236" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="388" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">フォーマット v3</text>
  <rect x="396" y="100" width="154" height="180" fill="#ffffff" fill-opacity="0.12"/>
  <g fill="#60a5fa">
    <rect x="396" y="100" width="18" height="18"/>
    <rect x="532" y="100" width="18" height="18"/>
    <rect x="396" y="262" width="18" height="18"/>
    <rect x="532" y="262" width="18" height="18"/>
  </g>
  <text x="570" y="160" fill="#60a5fa" font-size="13" font-weight="700">マーカー 24 セル</text>
  <text x="570" y="196" fill="#60a5fa" font-size="20" font-weight="700">89%</text>
  <text x="570" y="220" fill="#ffffff" fill-opacity="0.45" font-size="12">検出率</text>
</svg>
