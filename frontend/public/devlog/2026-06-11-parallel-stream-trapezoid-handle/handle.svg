<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">枠のヘッダ: 全幅バーから台形ハンドルへ</text>

  <!-- 前 -->
  <text x="24" y="72" fill="#ffffff" fill-opacity="0.45" font-size="12">前: 全幅のヘッダバー</text>
  <rect x="24" y="84" width="316" height="184" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.2"/>
  <g fill="#ffffff" fill-opacity="0.25">
    <rect x="32" y="90" width="56" height="16" rx="3"/>
    <rect x="276" y="90" width="56" height="16" rx="3"/>
    <rect x="32" y="244" width="56" height="16" rx="3"/>
    <rect x="276" y="244" width="56" height="16" rx="3"/>
  </g>
  <rect x="24" y="84" width="316" height="28" rx="6" fill="#f87171" fill-opacity="0.45"/>
  <text x="182" y="182" fill="#ffffff" fill-opacity="0.3" font-size="13" text-anchor="middle">配信</text>
  <text x="24" y="292" fill="#f87171" font-size="12">サイト側の隅の UI を覆う</text>

  <line x1="346" y1="176" x2="372" y2="176" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 後 -->
  <text x="380" y="72" fill="#ffffff" fill-opacity="0.45" font-size="12">後: 上部中央の台形ハンドル</text>
  <rect x="380" y="84" width="316" height="184" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.2"/>
  <g fill="#ffffff" fill-opacity="0.25">
    <rect x="388" y="90" width="56" height="16" rx="3"/>
    <rect x="632" y="90" width="56" height="16" rx="3"/>
    <rect x="388" y="244" width="56" height="16" rx="3"/>
    <rect x="632" y="244" width="56" height="16" rx="3"/>
  </g>
  <path d="M456 84 H620 L604 112 H472 Z" fill="#60a5fa" fill-opacity="0.3" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="538" y="103" fill="#ffffff" fill-opacity="0.85" font-size="11" font-weight="700" text-anchor="middle">題・音量・操作</text>
  <text x="538" y="182" fill="#ffffff" fill-opacity="0.3" font-size="13" text-anchor="middle">配信</text>
  <g stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M380 98 V84 H394"/>
    <path d="M682 84 H696 V98"/>
    <path d="M380 254 V268 H394"/>
    <path d="M682 268 H696 V254"/>
  </g>
  <text x="380" y="292" fill="#60a5fa" font-size="12">隅が空く。辺と四隅でいつでもリサイズ</text>
</svg>
