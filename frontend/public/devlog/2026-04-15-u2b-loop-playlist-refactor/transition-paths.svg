<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">トラック遷移: 3 系統が同じ後処理を通る</text>

  <!-- 自動 -->
  <rect x="40" y="64" width="180" height="44" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="130" y="91" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">自動遷移</text>

  <!-- 手動 -->
  <rect x="24" y="126" width="212" height="150" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="150" fill="#ffffff" fill-opacity="0.45" font-size="12">手動だけ排他制御</text>
  <rect x="40" y="162" width="180" height="44" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="130" y="189" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">手動の前後</text>
  <rect x="40" y="216" width="180" height="44" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="130" y="243" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">トラック選択</text>

  <line x1="228" y1="86" x2="298" y2="146" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="244" y1="184" x2="298" y2="172" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="244" y1="238" x2="298" y2="198" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 共通の後処理 -->
  <rect x="306" y="126" width="190" height="92" rx="10" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="401" y="164" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">共通の後処理</text>
  <text x="401" y="190" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">コールバック再設定</text>

  <line x1="504" y1="172" x2="540" y2="172" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 再生継続 -->
  <rect x="548" y="126" width="148" height="92" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="622" y="164" fill="#ffffff" fill-opacity="0.85" font-size="14" font-weight="700" text-anchor="middle">再生を継続</text>
  <text x="622" y="190" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">プリロードは任意</text>
</svg>
