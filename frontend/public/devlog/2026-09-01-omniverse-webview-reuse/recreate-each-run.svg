<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">続けて取得するときの WebView</text>

  <!-- 直す前 -->
  <text x="24" y="78" fill="#f87171" font-size="12" font-weight="700">直す前: 2 本目も同じ WebView を使い回す</text>
  <rect x="24" y="90" width="500" height="78" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="111" fill="#ffffff" fill-opacity="0.45" font-size="11">WebView</text>
  <rect x="40" y="120" width="220" height="36" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="150" y="143" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">フォロー取得</text>
  <rect x="288" y="120" width="220" height="36" rx="8" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="398" y="143" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">フォロワー取得</text>
  <line x1="262" y1="138" x2="286" y2="138" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="524" y1="138" x2="560" y2="138" stroke="#f87171" stroke-width="2" marker-end="url(#r)"/>
  <text x="568" y="134" fill="#f87171" font-size="13" font-weight="700">タイムアウト</text>
  <text x="568" y="154" fill="#ffffff" fill-opacity="0.6" font-size="11">器だけで本文が空</text>

  <!-- 直した後 -->
  <text x="24" y="210" fill="#60a5fa" font-size="12" font-weight="700">直した後: 1 本ごとに必ず作り直す</text>
  <rect x="24" y="222" width="240" height="68" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="40" y="243" fill="#ffffff" fill-opacity="0.45" font-size="11">WebView</text>
  <rect x="40" y="250" width="208" height="30" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="144" y="270" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">フォロー取得</text>
  <rect x="284" y="222" width="240" height="68" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="300" y="243" fill="#60a5fa" font-size="11" font-weight="700">WebView(新しく作る)</text>
  <rect x="300" y="250" width="208" height="30" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="404" y="270" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">フォロワー取得</text>
  <line x1="524" y1="256" x2="560" y2="256" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
  <text x="568" y="252" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">どちらも取れる</text>
  <text x="568" y="272" fill="#ffffff" fill-opacity="0.4" font-size="11">数秒よけいにかかる</text>
</svg>
