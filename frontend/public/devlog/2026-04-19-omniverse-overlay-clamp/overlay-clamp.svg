<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, sans-serif">
  <rect width="720" height="340" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">オーバーレイを画面の中に収める</text>

  <!-- 直す前 -->
  <text x="24" y="76" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <rect x="90" y="108" width="180" height="212" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.25"/>
  <rect x="110" y="60" width="140" height="180" rx="8" fill="#f87171" fill-opacity="0.15" stroke="#f87171" stroke-opacity="0.8"/>
  <text x="180" y="156" fill="#f87171" font-size="12" text-anchor="middle">オーバーレイ</text>
  <text x="286" y="80" fill="#f87171" font-size="12">上へ突き抜ける</text>
  <text x="286" y="100" fill="#ffffff" fill-opacity="0.4" font-size="11">つかめず、戻せない</text>
  <text x="180" y="300" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">画面</text>

  <!-- 直した後 -->
  <text x="420" y="76" fill="#60a5fa" font-size="12" font-weight="700">直した後</text>
  <rect x="516" y="108" width="180" height="212" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.25"/>
  <rect x="536" y="128" width="140" height="160" rx="8" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="606" y="212" fill="#60a5fa" font-size="12" text-anchor="middle">オーバーレイ</text>
  <line x1="506" y1="108" x2="506" y2="128" stroke="#60a5fa" stroke-width="2"/>
  <line x1="500" y1="108" x2="512" y2="108" stroke="#60a5fa" stroke-width="2"/>
  <line x1="500" y1="128" x2="512" y2="128" stroke="#60a5fa" stroke-width="2"/>
  <text x="494" y="122" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="end">上の余白 48dp</text>
  <text x="606" y="308" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">画面</text>

  <text x="300" y="196" fill="#ffffff" fill-opacity="0.6" font-size="12">移動のたびに</text>
  <text x="300" y="216" fill="#ffffff" fill-opacity="0.6" font-size="12">画面サイズを取り直し、</text>
  <text x="300" y="236" fill="#ffffff" fill-opacity="0.6" font-size="12">位置をクランプ</text>
  <text x="300" y="272" fill="#ffffff" fill-opacity="0.4" font-size="11">設定から位置・サイズのリセットも可</text>
</svg>
