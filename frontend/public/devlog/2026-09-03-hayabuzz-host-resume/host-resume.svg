<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">出題者がリロードしても部屋が続く仕組み</text>

  <!-- 出題者 -->
  <rect x="24" y="64" width="400" height="200" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">出題者の端末</text>

  <rect x="40" y="110" width="124" height="70" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="102" y="140" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">進行状態</text>
  <text x="102" y="162" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">参加者・得点</text>

  <rect x="284" y="110" width="124" height="70" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="346" y="140" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">localStorage</text>
  <text x="346" y="162" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">6 時間で無効</text>

  <line x1="170" y1="130" x2="276" y2="130" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="224" y="121" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">変わるたび保存</text>
  <line x1="278" y1="160" x2="172" y2="160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="224" y="179" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">リロード後に復元</text>

  <text x="40" y="218" fill="#ffffff" fill-opacity="0.4" font-size="11">復帰の入口</text>
  <text x="40" y="240" fill="#ffffff" fill-opacity="0.6" font-size="12">部屋コード入りの URL /「前の部屋に戻る」</text>

  <!-- 再接続 -->
  <line x1="494" y1="145" x2="432" y2="145" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="134" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">再接続</text>

  <!-- 回答者 -->
  <rect x="500" y="64" width="196" height="200" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="516" y="90" fill="#ffffff" fill-opacity="0.45" font-size="12">回答者</text>
  <rect x="516" y="110" width="164" height="70" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="598" y="140" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">戻りを待つ</text>
  <text x="598" y="162" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="middle">自動で参加し直す</text>
  <text x="516" y="218" fill="#ffffff" fill-opacity="0.6" font-size="12">同じセッション ID</text>
  <text x="516" y="240" fill="#ffffff" fill-opacity="0.6" font-size="12">得点も残る</text>
</svg>
