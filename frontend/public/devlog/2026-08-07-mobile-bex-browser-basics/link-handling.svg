<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.4"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">リンクを踏んでも、アプリに飛ばさない</text>

  <!-- 前 -->
  <text x="24" y="102" fill="#f87171" font-size="13" font-weight="700">前</text>
  <rect x="72" y="72" width="170" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="157" y="103" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">http / https のリンク</text>
  <line x1="242" y1="98" x2="502" y2="98" stroke="#f87171" stroke-width="2" marker-end="url(#red)"/>
  <rect x="506" y="72" width="190" height="52" rx="8" fill="#f87171" fill-opacity="0.15"/>
  <text x="601" y="103" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">別のアプリが開く</text>

  <line x1="24" y1="148" x2="696" y2="148" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- 後 -->
  <text x="24" y="206" fill="#60a5fa" font-size="13" font-weight="700">後</text>
  <rect x="72" y="176" width="170" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="157" y="207" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">http / https のリンク</text>
  <line x1="242" y1="202" x2="284" y2="202" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="288" y="176" width="170" height="52" rx="8" fill="#60a5fa" fill-opacity="0.25"/>
  <text x="373" y="207" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">ブラウザ内で開く</text>
  <line x1="458" y1="202" x2="502" y2="202" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#gray)"/>
  <rect x="506" y="176" width="190" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="601" y="207" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">アプリ</text>
  <text x="696" y="256" fill="#ffffff" fill-opacity="0.6" font-size="12" text-anchor="end">開きたいときだけ、三点メニューの「アプリで開く」</text>
</svg>
