<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.45"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">X 投稿の画像の渡し方を、iOS だけ分けた</text>

  <!-- 選んだ画像 -->
  <rect x="24" y="126" width="124" height="84" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="150" fill="#ffffff" fill-opacity="0.45" font-size="12">選んだ画像</text>
  <rect x="40" y="166" width="18" height="18" rx="3" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="64" y="166" width="18" height="18" rx="3" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="88" y="166" width="18" height="18" rx="3" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="112" y="166" width="18" height="18" rx="3" fill="#ffffff" fill-opacity="0.3"/>
  <line x1="148" y1="152" x2="196" y2="112" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" marker-end="url(#g)"/>
  <line x1="148" y1="186" x2="196" y2="222" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>

  <!-- Android -->
  <rect x="198" y="60" width="498" height="92" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="214" y="84" fill="#ffffff" fill-opacity="0.45" font-size="12">Android(元のまま)</text>
  <rect x="214" y="96" width="200" height="40" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="314" y="121" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">まとめて 1 回でセット</text>
  <line x1="414" y1="116" x2="498" y2="116" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" marker-end="url(#g)"/>
  <rect x="500" y="96" width="180" height="40" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="590" y="121" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">WebView の入力</text>

  <!-- iOS -->
  <rect x="198" y="172" width="498" height="108" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.5"/>
  <text x="214" y="196" fill="#60a5fa" font-size="12" font-weight="700">iOS(今回分けた)</text>
  <rect x="214" y="208" width="200" height="40" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="314" y="233" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">1 枚ごとにセット</text>
  <line x1="414" y1="228" x2="498" y2="228" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
  <text x="456" y="220" fill="#ffffff" fill-opacity="0.6" font-size="11" text-anchor="middle">change</text>
  <rect x="500" y="208" width="180" height="40" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="590" y="233" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">WebView の入力</text>
  <text x="214" y="268" fill="#f87171" font-size="11">まとめて渡すと、iPad ではすぐ空にされた</text>
</svg>
