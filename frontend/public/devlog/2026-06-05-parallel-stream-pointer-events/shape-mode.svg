<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, sans-serif">
  <rect width="720" height="340" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">整形モードと、枠ごとの不透明度・画質調整</text>

  <!-- ツールバー -->
  <rect x="24" y="56" width="672" height="44" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="36" y="66" width="72" height="24" rx="12" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="72" y="83" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">整形 ON</text>
  <g font-size="12" fill="#ffffff" fill-opacity="0.6">
    <text x="128" y="83">不透明度</text>
    <text x="268" y="83">明るさ</text>
    <text x="396" y="83">コントラスト</text>
    <text x="560" y="83">彩度</text>
  </g>
  <g stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7">
    <line x1="184" y1="79" x2="248" y2="79"/>
    <line x1="312" y1="79" x2="376" y2="79"/>
    <line x1="476" y1="79" x2="540" y2="79"/>
    <line x1="592" y1="79" x2="680" y2="79"/>
  </g>
  <g fill="#60a5fa">
    <circle cx="214" cy="79" r="5"/>
    <circle cx="350" cy="79" r="5"/>
    <circle cx="508" cy="79" r="5"/>
    <circle cx="636" cy="79" r="5"/>
  </g>

  <!-- 整形モードの枠 -->
  <rect x="60" y="128" width="300" height="168" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.7"/>
  <g fill="#60a5fa">
    <rect x="55" y="123" width="10" height="10"/>
    <rect x="205" y="123" width="10" height="10"/>
    <rect x="355" y="123" width="10" height="10"/>
    <rect x="55" y="207" width="10" height="10"/>
    <rect x="355" y="207" width="10" height="10"/>
    <rect x="55" y="291" width="10" height="10"/>
    <rect x="205" y="291" width="10" height="10"/>
    <rect x="355" y="291" width="10" height="10"/>
  </g>
  <text x="190" y="208" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">どこでも掴んで移動</text>
  <text x="190" y="230" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">8 つの辺と角でリサイズ</text>

  <!-- 半透明の枠 -->
  <rect x="330" y="160" width="330" height="150" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.5" stroke-dasharray="5 4"/>
  <text x="515" y="232" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700" text-anchor="middle">半透明の枠</text>
  <text x="515" y="254" fill="#ffffff" fill-opacity="0.4" font-size="11" text-anchor="middle">20〜100%。裏が透ける</text>
</svg>
