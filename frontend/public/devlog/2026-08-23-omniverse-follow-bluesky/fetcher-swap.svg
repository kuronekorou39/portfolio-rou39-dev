<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">Bluesky 対応は、取得口を差し替えるだけ</text>

  <!-- 共通 -->
  <rect x="24" y="112" width="170" height="120" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="138" fill="#ffffff" fill-opacity="0.45" font-size="12">共通</text>
  <text x="40" y="166" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">ジョブ制御</text>
  <text x="40" y="190" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">DB</text>
  <text x="40" y="216" fill="#60a5fa" font-size="11" font-weight="700">テスト 70 件を追加</text>
  <line x1="194" y1="172" x2="248" y2="172" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>

  <!-- 取得口 -->
  <rect x="250" y="60" width="446" height="224" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="266" y="84" fill="#ffffff" fill-opacity="0.45" font-size="12">取得口</text>

  <rect x="266" y="98" width="414" height="56" rx="8" fill="#0b0c10" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="282" y="131" fill="#ffffff" fill-opacity="0.85" font-size="13" font-weight="700">X</text>
  <text x="360" y="131" fill="#ffffff" fill-opacity="0.6" font-size="13">画面外の WebView</text>

  <rect x="266" y="168" width="414" height="100" rx="8" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="282" y="196" fill="#60a5fa" font-size="13" font-weight="700">Bluesky</text>
  <text x="360" y="196" fill="#ffffff" fill-opacity="0.85" font-size="13">公開の API を素の HTTP で</text>
  <text x="360" y="224" fill="#ffffff" fill-opacity="0.6" font-size="12">一覧に無いフォロワー数などは</text>
  <text x="360" y="246" fill="#ffffff" fill-opacity="0.6" font-size="12">25 人ずつプロフィールを引き直す</text>
</svg>
