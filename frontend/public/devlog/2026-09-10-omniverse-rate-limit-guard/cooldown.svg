<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">429 のあと、次に送るまでの待ち時間</text>
  <text x="696" y="36" fill="#ffffff" fill-opacity="0.4" font-size="12" text-anchor="end">X の窓は 15 分</text>
  <g font-size="13">
    <text x="24" y="85" fill="#f87171">直す前</text>
    <rect x="150" y="68" width="3" height="26" rx="1" fill="#f87171"/>
    <text x="163" y="86" fill="#f87171">2 秒・4 秒で叩き直す</text>

    <text x="24" y="131" fill="#ffffff" fill-opacity="0.6">連続 1 回目</text>
    <rect x="150" y="114" width="33" height="26" rx="4" fill="#60a5fa" fill-opacity="0.4"/>
    <text x="193" y="132" fill="#ffffff" fill-opacity="0.7">1 分</text>

    <text x="24" y="177" fill="#ffffff" fill-opacity="0.6">連続 2 回目</text>
    <rect x="150" y="160" width="67" height="26" rx="4" fill="#60a5fa" fill-opacity="0.55"/>
    <text x="227" y="178" fill="#ffffff" fill-opacity="0.7">2 分</text>

    <text x="24" y="223" fill="#ffffff" fill-opacity="0.6">連続 3 回目</text>
    <rect x="150" y="206" width="167" height="26" rx="4" fill="#60a5fa" fill-opacity="0.7"/>
    <text x="327" y="224" fill="#ffffff" fill-opacity="0.7">5 分</text>

    <text x="24" y="269" fill="#ffffff" fill-opacity="0.6">連続 4 回目〜</text>
    <rect x="150" y="252" width="500" height="26" rx="4" fill="#60a5fa"/>
    <text x="660" y="270" fill="#ffffff" font-weight="700">15 分</text>
  </g>
</svg>
