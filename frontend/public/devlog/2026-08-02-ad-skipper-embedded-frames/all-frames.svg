<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">content script を埋め込みフレームにも注入する</text>

  <!-- ページ -->
  <rect x="24" y="60" width="420" height="216" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="86" fill="#ffffff" fill-opacity="0.45" font-size="12">他のサイトのページ(最上位フレーム)</text>
  <rect x="40" y="98" width="388" height="24" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="60" y="134" width="348" height="126" rx="8" fill="#0b0c10" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="76" y="160" fill="#ffffff" fill-opacity="0.7" font-size="12">埋め込みプレイヤー (iframe)</text>
  <rect x="76" y="176" width="150" height="34" rx="17" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="151" y="198" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">content script</text>
  <text x="76" y="240" fill="#ffffff" fill-opacity="0.4" font-size="11">YouTube 版 / Twitch 版</text>

  <!-- 右 -->
  <text x="474" y="100" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <text x="474" y="124" fill="#ffffff" fill-opacity="0.6" font-size="12">最上位フレームにだけ注入</text>
  <text x="474" y="146" fill="#f87171" font-size="12">iframe の中には届かない</text>

  <line x1="468" y1="194" x2="234" y2="194" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="474" y="186" fill="#60a5fa" font-size="12" font-weight="700">直した後</text>
  <text x="474" y="210" fill="#60a5fa" font-size="13" font-weight="700">all_frames</text>
  <text x="474" y="234" fill="#ffffff" fill-opacity="0.6" font-size="12">埋め込みフレームにも注入</text>
</svg>
