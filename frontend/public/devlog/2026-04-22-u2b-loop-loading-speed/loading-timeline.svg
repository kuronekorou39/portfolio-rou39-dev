<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#0b0c10"/>
  <text x="24" y="36" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="700">再生開始までに待つもの</text>

  <!-- 直す前 -->
  <text x="24" y="98" fill="#f87171" font-size="12" font-weight="700">直す前</text>
  <rect x="100" y="74" width="200" height="40" rx="8" fill="#ffffff" fill-opacity="0.08"/>
  <text x="200" y="99" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">そのほかの準備</text>
  <rect x="304" y="74" width="230" height="40" rx="8" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.6"/>
  <text x="419" y="99" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">波形用の音声 DL</text>
  <line x1="540" y1="64" x2="540" y2="124" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <text x="552" y="99" fill="#ffffff" fill-opacity="0.6" font-size="13">再生開始</text>

  <!-- 短縮 -->
  <line x1="310" y1="150" x2="534" y2="150" stroke="#60a5fa" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="552" y="154" fill="#60a5fa" font-size="12" font-weight="700">数秒〜30 秒短縮</text>

  <!-- 直した後 -->
  <text x="24" y="210" fill="#60a5fa" font-size="12" font-weight="700">直した後</text>
  <rect x="100" y="186" width="200" height="40" rx="8" fill="#ffffff" fill-opacity="0.08"/>
  <text x="200" y="211" fill="#ffffff" fill-opacity="0.6" font-size="13" text-anchor="middle">そのほかの準備</text>
  <line x1="304" y1="176" x2="304" y2="270" stroke="#60a5fa" stroke-width="2"/>
  <text x="316" y="204" fill="#60a5fa" font-size="13" font-weight="700">再生開始</text>
  <rect x="316" y="222" width="230" height="40" rx="8" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="431" y="247" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="middle">波形用の音声 DL(裏で)</text>
</svg>
