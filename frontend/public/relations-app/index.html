<style>
  html,body{margin:0;padding:0;background:#eae6dd;font-family:"Noto Sans JP",system-ui,sans-serif;color:#1a1a1a;overflow:hidden;
    /* スマホでタップ時の青ハイライト + テキスト選択を抑制 */
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
  }
  /* 入力要素 (検索ボックス) は選択可 */
  input, textarea { -webkit-user-select:text; user-select:text; }
  #root{width:100vw;height:100vh}

  /* リッチなローディング画面 */
  .rl-load-root {
    position:fixed; inset:0; z-index:99999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #f5f1e8 0%, #e8dfd0 100%);
    color:#1a1a1a; font-family:"Noto Sans JP",system-ui,sans-serif;
    transition: opacity .4s ease;
  }
  .rl-load-title { font-family:"Noto Serif JP",serif; font-size:32px; font-weight:600; letter-spacing:.18em; color:#1a1a1a; margin-bottom:6px; }
  .rl-load-sub { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#6a6258; margin-bottom:48px; }
  .rl-load-ring { position:relative; width:160px; height:160px; margin-bottom:24px; }
  .rl-load-ring svg { transform: rotate(-90deg); width:100%; height:100%; }
  .rl-load-ring .bg { stroke:rgba(20,18,14,0.08); }
  .rl-load-ring .fg { stroke:#b64727; transition: stroke-dashoffset .25s ease; }
  .rl-load-ring .pct {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:"JetBrains Mono",monospace; font-size:26px; font-weight:500; color:#1a1a1a;
  }
  .rl-load-status { font-size:12px; color:#6a6258; letter-spacing:.08em; min-height:18px; }
  .rl-load-bytes { font-family:"JetBrains Mono",monospace; font-size:10px; color:#9a8e80; margin-top:6px; letter-spacing:.04em; }
  .rl-load-error { color:#b64727; font-size:13px; margin-top:24px; max-width:480px; text-align:center; line-height:1.6; }
  .rl-load-pulse { animation: rl-pulse 1.4s ease-in-out infinite; }
  @keyframes rl-pulse { 0%,100% { opacity:1 } 50% { opacity:.5 } }

  /* プラン選択画面 */
  .rl-plan-grid { display:grid; grid-template-columns:repeat(3,minmax(200px,240px)); gap:16px; max-width:95vw; }
  .rl-plan-card {
    position:relative; padding:22px 20px;
    background:#fffdf8; border:1px solid rgba(20,18,14,0.14); border-radius:6px;
    cursor:pointer; text-align:left;
    font-family:inherit; color:#1a1a1a;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .rl-plan-card:hover { border-color:#b64727; transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.08); }
  .rl-plan-card.recommended { border-color:#b64727; box-shadow:0 4px 14px rgba(182,71,39,.12); }
  .rl-plan-card.disabled { opacity:0.45; cursor:not-allowed; background:#f4f0e8; }
  .rl-plan-card.disabled:hover { transform:none; border-color:rgba(20,18,14,0.14); box-shadow:none; }
  .rl-plan-card-name { font-size:18px; font-weight:600; }
  .rl-plan-card-size { font-family:"JetBrains Mono",monospace; font-size:13px; color:#b64727; margin-top:8px; }
  .rl-plan-card-meta { font-size:11px; color:#6a6258; margin-top:6px; line-height:1.5; }
  .rl-plan-card-desc { font-size:11px; color:#9a8e80; margin-top:10px; line-height:1.5; }
  .rl-plan-card-badge {
    position:absolute; top:-8px; right:12px;
    background:#b64727; color:#fff;
    font-size:9px; font-weight:600; padding:3px 9px; border-radius:10px;
    letter-spacing:.14em; text-transform:uppercase;
  }
  @media (max-width:768px) {
    .rl-plan-grid { grid-template-columns:1fr; width:90vw; max-width:320px; }
  }
</style>

<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>

<body>
<div id="root"></div>

<script src="src/data.js"></script>

<script type="text/babel" src="src/oz-viz.jsx"></script>

<script type="text/babel" data-presets="react">
function formatBytes(n) {
  if (!n && n !== 0) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

// 進捗付き fetch (ReadableStream + Content-Length)
// chunks を一度に Blob にせず、 TextDecoder で逐次 text に積む(モバイルメモリ節約)
async function fetchWithProgress(url, onProgress) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + ' fetch failed: ' + res.status);
  const total = +(res.headers.get('Content-Length') || 0);
  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let text = '';
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    text += decoder.decode(value, { stream: true });
    received += value.length;
    onProgress(received, total);
  }
  text += decoder.decode();
  return text;
}

function LoadingScreen({ progress, status, received, total, error, fading }) {
  const C = 2 * Math.PI * 70; // 半径70, 円周
  const dashOffset = C * (1 - Math.min(1, Math.max(0, progress)));
  const pct = Math.round(progress * 100);
  return (
    <div className="rl-load-root" style={{ opacity: fading ? 0 : 1 }}>
      <div className="rl-load-title">Relations</div>
      <div className="rl-load-sub">3D Visualizer</div>
      <div className="rl-load-ring">
        <svg viewBox="0 0 160 160">
          <circle className="bg" cx="80" cy="80" r="70" fill="none" strokeWidth="3" />
          <circle className="fg" cx="80" cy="80" r="70" fill="none" strokeWidth="3"
            strokeDasharray={C} strokeDashoffset={dashOffset} strokeLinecap="round" />
        </svg>
        <div className="pct">{pct}%</div>
      </div>
      <div className="rl-load-status">{status}</div>
      {total > 0 && (
        <div className="rl-load-bytes">{formatBytes(received)} / {formatBytes(total)}</div>
      )}
      {error && <div className="rl-load-error">{error}</div>}
    </div>
  );
}

const PLANS = [
  { id: 'light', name: 'ライト', file: 'data/depth2-t500.json',
    sizeRaw: 79, sizeGz: 16, nodes: '約 3,000', edges: '約 53万',
    desc: 'スマホ・低速回線向け。 共通フォロー先 500人以上で絞った軽量版' },
  { id: 'standard', name: '標準', file: 'data/depth2.json',
    sizeRaw: 169, sizeGz: 33, nodes: '約 6,500', edges: '約 100万',
    desc: 'PC・一般向け。 共通フォロー先 100人以上を含む' },
  { id: 'large', name: '大量', file: 'data/depth2-t10.json',
    sizeRaw: 329, sizeGz: 66, nodes: '約 45,000', edges: '約 220万',
    desc: 'ハイスペックPC向け。 共通フォロー先 10人以上を含む' },
  { id: 'full', name: 'フル', file: 'data/depth2-t1.json',
    sizeRaw: 693, sizeGz: 139, nodes: '約 110万', edges: '約 370万',
    desc: '取得した全データを表示する重量版 (ローカル限定)',
    localOnly: true },
];

function PlanSelector({ onSelect }) {
  const isMobile = typeof window !== 'undefined' && window.innerWidth < 768;
  const variant = typeof window !== 'undefined' ? new URLSearchParams(window.location.search).get('data') : null;
  // クエリで指定されてれば自動選択 (ローカル検証用 ?data=t10 等)
  React.useEffect(() => {
    if (!variant) return;
    onSelect({
      id: variant, name: variant, file: `data/depth2-${variant}.json`,
      sizeRaw: 0, sizeGz: 0, nodes: '?', edges: '?', desc: 'クエリ指定',
    });
  }, []);
  if (variant) return null; // クエリ時は何も描画せず即 fetch へ

  const recommended = isMobile ? 'light' : 'standard';
  const isLocal = typeof window !== 'undefined'
    && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
  return (
    <div className="rl-load-root">
      <div className="rl-load-title">Relations</div>
      <div className="rl-load-sub">読み込むデータを選択</div>
      <div className="rl-plan-grid">
        {PLANS.map(p => {
          const disabled = p.localOnly && !isLocal;
          return (
            <button key={p.id} disabled={disabled}
              className={`rl-plan-card ${p.id === recommended ? 'recommended' : ''} ${disabled ? 'disabled' : ''}`}
              onClick={() => !disabled && onSelect(p)}>
              {p.id === recommended && !disabled && <div className="rl-plan-card-badge">おすすめ</div>}
              {disabled && <div className="rl-plan-card-badge" style={{ background:'#6a6258' }}>ローカル限定</div>}
              <div className="rl-plan-card-name">{p.name}</div>
              <div className="rl-plan-card-size">{p.sizeRaw}MB <span style={{ color:'#9a8e80' }}>(gzip 約{p.sizeGz}MB)</span></div>
              <div className="rl-plan-card-meta">ノード {p.nodes} / エッジ {p.edges}</div>
              <div className="rl-plan-card-desc">{p.desc}</div>
            </button>
          );
        })}
      </div>
      <div style={{ marginTop:24, fontSize:10, color:'#9a8e80', letterSpacing:'.08em' }}>
        ※ {isMobile ? 'スマホ判定: ライト推奨' : 'PC判定: 標準推奨'}
      </div>
    </div>
  );
}

function App() {
  const [plan, setPlan] = React.useState(null);
  const [graph, setGraph] = React.useState(null);
  const [progress, setProgress] = React.useState(0);
  const [status, setStatus] = React.useState('データを読み込み中…');
  const [received, setReceived] = React.useState(0);
  const [total, setTotal] = React.useState(0);
  const [error, setError] = React.useState(null);
  const [fading, setFading] = React.useState(false);

  React.useEffect(() => {
    if (!plan) return;
    (async () => {
      try {
        const text = await fetchWithProgress(plan.file, (r, t) => {
          setReceived(r); setTotal(t);
          if (t > 0) setProgress(r / t);
        });
        setStatus('データを展開中…');
        await new Promise(r => setTimeout(r, 30));
        const records = JSON.parse(text);
        setStatus('グラフを構築中…');
        await new Promise(r => setTimeout(r, 30));
        const root = window.OZLoader.guessRoot(records);
        const g = window.OZLoader.convert(records, { rootHandle: root });
        setStatus('描画準備中…');
        setProgress(1);
        await new Promise(r => setTimeout(r, 200));
        setFading(true);
        setTimeout(() => setGraph(g), 400);
      } catch (e) {
        setError('読み込みに失敗しました: ' + e.message);
      }
    })();
  }, [plan]);

  if (!plan) return <PlanSelector onSelect={setPlan} />;
  if (!graph) {
    return <LoadingScreen
      progress={progress} status={status}
      received={received} total={total}
      error={error} fading={fading} />;
  }
  return <OZViz graph={graph} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
